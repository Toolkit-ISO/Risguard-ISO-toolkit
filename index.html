<style>
:root{
  --navy:#0E2841;--blue:#1F55A6;--blue-h:#185099;--blue-light:#E6F1FB;
  --orange:#E97132;--green:#1D9E75;--green-light:#E1F5EE;
  --amber:#BA7517;--amber-light:#FAEEDA;--red:#A32D2D;--red-light:#FCEBEB;
  --gray-bg:#F0F4F8;--gray-mid:#E2E8F0;
  --text:#0E2841;--text-muted:#5A6B7E;--border:#D1DCE8;--white:#FFFFFF;
  --radius:10px;--radius-sm:6px;
  --sh:0 1px 3px rgba(14,40,65,.07),0 4px 12px rgba(14,40,65,.04);
  --sh-md:0 2px 8px rgba(14,40,65,.1),0 8px 24px rgba(14,40,65,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:DM Sans,sans-serif;background:var(--gray-bg);color:var(--text);min-height:100vh;display:flex;}
.sidebar{width:230px;min-height:100vh;background:var(--navy);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:20;}
.sidebar-logo{padding:1.5rem 1.25rem 1.25rem;border-bottom:1px solid rgba(255,255,255,.07);}
.logo-img{height:44px;width:auto;max-width:180px;filter:brightness(0) invert(1);}
.logo-sub{font-size:10.5px;color:rgba(255,255,255,.35);margin-top:5px;letter-spacing:.06em;}
.sidebar-section{font-size:10px;font-weight:600;color:rgba(255,255,255,.22);letter-spacing:.1em;text-transform:uppercase;padding:1rem 1.25rem .35rem;}
.sidebar-section-bold{font-size:11px;font-weight:700;color:rgba(255,255,255,.75);letter-spacing:.08em;text-transform:uppercase;padding:1rem 1.25rem .35rem;}
.sidebar-nav{flex:1;padding:.75rem;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;color:rgba(255,255,255,.5);cursor:pointer;transition:all .12s;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
.nav-item:hover{color:rgba(255,255,255,.85);background:rgba(255,255,255,.06);}
.nav-item.active{color:#fff;background:rgba(255,255,255,.11);}
.sidebar-footer{padding:1rem 1.25rem;border-top:1px solid rgba(255,255,255,.07);}
.footer-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.3);}
.footer-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);}
.main{margin-left:230px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.bc{display:flex;align-items:center;gap:7px;font-size:13px;}
.bc-link{color:var(--text-muted);cursor:pointer;background:none;border:none;font-family:inherit;font-size:13px;padding:0;}
.bc-link:hover{color:var(--text);}
.bc-sep{color:var(--gray-mid);font-size:15px;}
.bc-cur{color:var(--text);font-weight:500;}
.content{padding:2rem;flex:1;}
.top-act{display:flex;gap:8px;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--text);font-family:inherit;transition:all .12s;white-space:nowrap;}
.btn:hover{background:var(--gray-bg);}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-h);border-color:var(--blue-h);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-danger{color:var(--red);border-color:#F7C1C1;}
.btn-danger:hover{background:var(--red-light);}
.btn-edit{color:var(--blue);border-color:#B5D4F4;}
.btn-edit:hover{background:var(--blue-light);}
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
.client-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;cursor:pointer;position:relative;transition:all .14s;box-shadow:var(--sh);}
.client-card:hover{border-color:var(--blue);box-shadow:var(--sh-md),0 0 0 3px rgba(31,85,166,.08);transform:translateY(-1px);}
.c-avatar{width:44px;height:44px;border-radius:10px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--blue);margin-bottom:12px;}
.c-name{font-size:14px;font-weight:600;margin-bottom:3px;}
.c-phase{font-size:12px;color:var(--text-muted);margin-bottom:12px;}
.pbar{height:3px;background:var(--gray-mid);border-radius:2px;overflow:hidden;}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--blue),#4A8FD4);border-radius:2px;transition:width .4s;}
.pbar-label{font-size:11px;color:var(--text-muted);margin-top:5px;}
.card-del{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:5px;border:none;background:none;color:var(--text-muted);cursor:pointer;opacity:0;transition:opacity .12s;display:flex;align-items:center;justify-content:center;font-size:13px;}
.client-card:hover .card-del{opacity:1;}
.card-menu{position:absolute;top:8px;right:34px;background:none;border:none;cursor:pointer;font-size:16px;opacity:0;color:var(--text-muted);padding:2px 6px;border-radius:4px;transition:opacity .14s;letter-spacing:1px;line-height:1;}
.client-card:hover .card-menu{opacity:1;}
.card-menu:hover{background:var(--bg);color:var(--text);}
.card-dropdown{position:absolute;top:32px;right:34px;background:var(--white);border:1px solid var(--border);border-radius:8px;box-shadow:var(--sh-md);z-index:50;min-width:180px;padding:4px 0;display:none;}
.card-dropdown.open{display:block;}
.card-dropdown button{display:block;width:100%;text-align:left;padding:8px 14px;font-size:13px;font-family:DM Sans,sans-serif;background:none;border:none;cursor:pointer;color:var(--text);}
.card-dropdown button:hover{background:var(--bg);}
.card-dropdown .dd-divider{height:1px;background:var(--border);margin:4px 0;}
.card-dropdown .dd-next{color:var(--blue);font-weight:500;}
.card-del:hover{background:var(--red-light);color:var(--red);}
.open-hint{position:absolute;bottom:12px;right:14px;font-size:11px;color:var(--blue);opacity:0;transition:opacity .12s;}
.client-card:hover .open-hint{opacity:1;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.75rem;}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;box-shadow:var(--sh);}
.stat-val{font-size:26px;font-weight:600;line-height:1.1;}
.stat-lbl{font-size:12px;color:var(--text-muted);margin-top:4px;}
.prog-hdr{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.5rem;margin-bottom:1.75rem;display:flex;align-items:center;gap:20px;box-shadow:var(--sh);}
.prog-pct{font-size:26px;font-weight:600;color:var(--blue);white-space:nowrap;}
.prog-trk{flex:1;}
.prog-lbl{font-size:12px;color:var(--text-muted);margin-bottom:6px;}
.prog-bar{height:6px;background:var(--gray-mid);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),#4A8FD4);border-radius:3px;transition:width .4s;}
.det-hdr{display:flex;align-items:center;gap:14px;margin-bottom:1.75rem;}
.det-avatar{width:52px;height:52px;border-radius:12px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:var(--blue);flex-shrink:0;}
.det-name{font-size:20px;font-weight:600;}
.det-sub{font-size:13px;color:var(--text-muted);margin-top:3px;}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.5rem;}
.tab{padding:10px 18px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text-muted);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;transition:all .12s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap;}
.search-in{padding:7px 11px;font-size:13px;font-family:DM Sans,sans-serif;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--white);color:var(--text);width:220px;}
.search-in:focus{outline:none;border-color:var(--blue);}
.flt-sel{padding:7px 11px;font-size:13px;font-family:DM Sans,sans-serif;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--white);color:var(--text);}
.flt-sel:focus{outline:none;border-color:var(--blue);}
.res-cnt{font-size:12px;color:var(--text-muted);margin-left:auto;}
.tbl-wrap{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--sh);}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.05em;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--gray-bg);}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#F7FAFD;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;}
.b-concept{background:#F1EFE8;color:#5F5E5A;}
.b-review{background:var(--amber-light);color:var(--amber);}
.b-approved{background:var(--green-light);color:#0F6E56;}
.b-na{background:var(--gray-mid);color:var(--text-muted);}
.b-compliant{background:var(--green-light);color:#0F6E56;}
.b-gap{background:#FEE2E2;color:#DC2626;}
.b-minor{background:#FFF3E0;color:#C05621;}
.b-major{background:#FEE2E2;color:#DC2626;}
.b-open{background:#F1EFE8;color:#5F5E5A;}
.b-ofi{background:#E6F1FB;color:#185FA5;}
.desc-box{background:var(--bg-alt,#F5F7FA);border-radius:6px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:var(--text-main);white-space:pre-wrap;border:1px solid var(--border);}
.doc-box{background:#EFF6FF;border-color:#BFDBFE;color:#1E3A5F;font-weight:500;}

.d-ofi{background:#185FA5;}
.sdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.d-concept{background:#888780;}.d-review{background:var(--amber);}.d-approved{background:var(--green);}
.phase-list{display:flex;flex-direction:column;gap:10px;}
.phase-item{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;cursor:pointer;transition:all .12s;box-shadow:var(--sh);}
.phase-item:hover{border-color:var(--blue);box-shadow:var(--sh-md);}
.phase-item.expanded{border-color:var(--blue);}
.ph-hdr{display:flex;align-items:center;justify-content:space-between;}
.ph-name{font-size:14px;font-weight:500;}
.ph-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
.ph-mini-bar{width:160px;height:3px;background:var(--gray-mid);border-radius:2px;overflow:hidden;margin-top:7px;}
.ph-mini-fill{height:100%;background:var(--blue);border-radius:2px;}
.ph-pct{font-size:18px;font-weight:600;color:var(--blue);}
.ph-docs{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.ph-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.ph-stat{background:var(--gray-bg);border-radius:var(--radius-sm);padding:8px 10px;text-align:center;}
.ph-stat-val{font-size:16px;font-weight:600;}
.ph-stat-lbl{font-size:11px;color:var(--text-muted);margin-top:2px;}
.notes-wrap{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;box-shadow:var(--sh);}
.notes-area{width:100%;min-height:90px;padding:10px 12px;font-size:13px;font-family:DM Sans,sans-serif;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--white);color:var(--text);resize:vertical;line-height:1.6;}
.notes-area:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,85,166,.1);}
.note-entry{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--sh);}
.modal-overlay{position:fixed;inset:0;background:rgba(14,40,65,.4);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal{background:var(--white);border-radius:14px;border:1px solid var(--border);padding:1.75rem;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-md);animation:su .18s ease;}
@keyframes su{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.modal-title{font-size:16px;font-weight:600;margin-bottom:1.25rem;}
.field{margin-bottom:1rem;}
.field label{display:block;font-size:12px;font-weight:500;color:var(--text-muted);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:8px 11px;font-size:13px;font-family:DM Sans,sans-serif;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--white);color:var(--text);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,85,166,.1);}
.field textarea{min-height:80px;resize:vertical;line-height:1.5;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:1.5rem;}
.import-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:2rem;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:1rem;}
.import-zone:hover,.import-zone.drag{border-color:var(--blue);background:var(--blue-light);}
.iz-title{font-size:14px;font-weight:500;margin-bottom:4px;}
.iz-sub{font-size:12px;color:var(--text-muted);}
.imp-list{max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:1rem;}
.imp-item{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;gap:8px;}
.imp-item:last-child{border-bottom:none;}
.empty{text-align:center;padding:4rem 2rem;}
.empty-icon{font-size:36px;margin-bottom:12px;opacity:.25;}
.empty-title{font-size:15px;font-weight:600;margin-bottom:6px;}
.empty-sub{font-size:13px;color:var(--text-muted);margin-bottom:1.5rem;line-height:1.6;}
.doc-link{color:var(--blue);text-decoration:none;font-weight:500;}
.upload-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 6px;border-radius:10px;background:#E1F5EE;color:#0F6E56;font-weight:500;vertical-align:middle;margin-left:5px;}
.doc-link:hover{text-decoration:underline;}
.mono{font-family:DM Mono,monospace;font-size:11.5px;}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:500;background:var(--gray-mid);color:var(--text-muted);}
.tag-a5{background:#E6F1FB;color:#185FA5;}
.tag-a6{background:#E1F5EE;color:#0F6E56;}
.tag-a7{background:var(--amber-light);color:var(--amber);}
.tag-a8{background:var(--red-light);color:var(--red);}
.soa-toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;}
.toggle-box{width:32px;height:18px;border-radius:9px;background:var(--gray-mid);position:relative;transition:background .15s;flex-shrink:0;}
.toggle-box.on{background:var(--blue);}
.toggle-dot{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s;}
.toggle-box.on .toggle-dot{left:16px;}
.audit-grp-hdr{background:var(--navy);color:#fff;padding:10px 14px;font-size:12px;font-weight:600;letter-spacing:.05em;border-radius:var(--radius-sm);margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;}
.audit-grp-hdr .grp-pct{font-size:11px;font-weight:400;opacity:.7;}
.na-row td{opacity:.45;}
.divider{border:none;border-top:1px solid var(--border);margin:1.25rem 0;}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->

<script>
// ═══════════════════════════════════════════
// MSAL AUTHENTICATION
// ═══════════════════════════════════════════
var MSAL_CONFIG={
  auth:{
    clientId:'77b1c049-424c-4146-9539-37c9c900c19e',
    authority:'https://login.microsoftonline.com/6a80b5b2-0522-4a22-b601-7fae94f750b4',
    redirectUri:'https://toolkit-iso.github.io/Risguard-ISO-toolkit/'
  },
  cache:{cacheLocation:'sessionStorage',storeAuthStateInCookie:false}
};
var GRAPH_SCOPES=['User.Read','Sites.ReadWrite.All','Files.ReadWrite.All'];
var msalInstance=null;
var AUTH={user:null,token:null,ready:false};

function initMsal(){
  try{
    if(typeof msal==='undefined')throw new Error('MSAL not loaded');
    msalInstance=new msal.PublicClientApplication(MSAL_CONFIG);
    msalInstance.handleRedirectPromise().then(function(resp){
      if(resp&&resp.account){
        msalInstance.setActiveAccount(resp.account);
        AUTH.user=resp.account;AUTH.token=resp.accessToken;AUTH.ready=true;
        hideLoginScreen();saveUserToStorage(resp.account);
      } else {
        var accounts=msalInstance.getAllAccounts();
        if(accounts.length>0){
          msalInstance.setActiveAccount(accounts[0]);
          AUTH.user=accounts[0];AUTH.ready=true;
          acquireTokenSilent().then(function(){hideLoginScreen();}).catch(function(){showLoginScreen();});
        } else {showLoginScreen();}
      }
    }).catch(function(e){console.error('MSAL redirect:',e);showLoginScreen();});
  } catch(e){
    console.warn('MSAL unavailable, running local mode');
    AUTH.ready=true;
    document.getElementById('login-screen').style.display='none';
    setTimeout(function(){render();renderUserBadge();},200);
  }
}

function acquireTokenSilent(){
  return msalInstance.acquireTokenSilent({scopes:GRAPH_SCOPES,account:AUTH.user}).then(function(r){AUTH.token=r.accessToken;return r.accessToken;});
}
function acquireToken(){
  return acquireTokenSilent().catch(function(){
    return msalInstance.acquireTokenPopup({scopes:GRAPH_SCOPES}).then(function(r){AUTH.token=r.accessToken;return r.accessToken;});
  });
}
function login(){msalInstance.loginRedirect({scopes:GRAPH_SCOPES});}
function logout(){if(msalInstance)msalInstance.logoutRedirect({postLogoutRedirectUri:window.location.href});}

function saveUserToStorage(account){
  try{
    var users=JSON.parse(localStorage.getItem('rg_users')||'{}');
    var uid=account.localAccountId;
    if(!users[uid]){users[uid]={id:uid,name:account.name,email:account.username,role:'consultant',addedAt:new Date().toISOString()};localStorage.setItem('rg_users',JSON.stringify(users));}
  }catch(e){}
}

function showLoginScreen(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-root').style.display='none';
}
function hideLoginScreen(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-root').style.display='contents';
  setTimeout(function(){
    render();
    renderUserBadge();
  },100);
}
function renderUserBadge(){
  var el=document.getElementById('user-badge');
  if(!el||!AUTH.user)return;
  var ini=(AUTH.user.name||'?').split(' ').map(function(n){return n[0];}).join('').substring(0,2).toUpperCase();
  el.innerHTML='<div style="display:flex;align-items:center;gap:8px">'+
    '<div style="width:30px;height:30px;border-radius:50%;background:#E97132;color:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">'+ini+'</div>'+
    '<div style="line-height:1.3;min-width:0"><div style="font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px">'+(AUTH.user.name||AUTH.user.username)+'</div>'+
    '<div style="font-size:10px;color:var(--text-muted)">'+AUTH.user.username+'</div></div>'+
    '<button onclick="logout()" style="background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;color:var(--text-muted);white-space:nowrap">Uitloggen</button>'+
  '</div>';
}

// Graph API helpers
var GRAPH='https://graph.microsoft.com/v1.0';
function graphGet(url){return acquireToken().then(function(t){return fetch(GRAPH+url,{headers:{Authorization:'Bearer '+t}}).then(function(r){return r.json();});});}
function graphPost(url,body){return acquireToken().then(function(t){return fetch(GRAPH+url,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();});});}
function graphPatch(url,body){return acquireToken().then(function(t){return fetch(GRAPH+url,{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();});});}

window.addEventListener('load',function(){
  // Always render the app first
  render();
  // Then try MSAL
  initMsal();
});
</script>

var CLAUSE_DESC={'4.1':{name:'Understanding the organization and its context',req:'The organization shall determine external and internal issues that are relevant to its purpose and that affect its ability to achieve the intended outcome(s) of its information security management system.\n\nThe organization shall determine whether climate change is a relevant issue.',q:'Has the organization identified internal and external issues affecting the ISMS?',doc:'Context analysis document\nSWOT/PESTLE'},'4.2':{name:'Understanding the needs and expectations of interested parties',req:'The organization shall determine: \na) interested parties that are relevant to the information security management system; and \nb) the requirements of these interested parties relevant to information security.\nc) Relevant interested parties can have requirements related to climate change.',q:'Are interested parties and their requirements identified and documented?',doc:'Stakeholder analysis \nRequirements register'},'4.3':{name:'Determining the scope of the information security management system',req:'The organization shall determine the boundaries and applicability of the information security management system to establish its scope.\nWhen determining this scope, the organization shall consider:\na) the external and internal issues referred to in 4.1; \nb) the requirements referred to in 4.2; and\nc) interfaces and dependencies between activities performed by the organization, and those that are performed by other organizations. \nThe scope shall be available as documented information.',q:'Is the ISMS scope defined and approved?\nAre exclusions justified?',doc:'ISMS scope statement'},'4.4':{name:'Information security management system',req:'The organization shall establish, implement, maintain and continually improve an information security management system, in accordance with the requirements of this International Standard.',q:'Are ISMS processes defined and maintained?',doc:'ISMS framework/description'},'5.1':{name:'Leadership and commitment',req:'Top management shall demonstrate leadership and commitment with respect to the information security management system by:\na) ensuring the information security policy and the information security objectives are established and are compatible with the strategic direction of the organization;\nb) ensuring the integration of the information security management system requirements into the organization’s processes; \nc) ensuring that the resources needed for the information security management system are available;\nd) communicating the importance of effective information security management and of conforming to the information security management system requirements; \ne) ensuring that the information security management system achieves its intended outcome(s);\nf) directing and supporting persons to contribute to the effectiveness of the information security management system;\ng) promoting continual improvement; and\nh) supporting other relevant management roles to demonstrate their leadership as it applies to their areas of responsibility.',q:'Does top management demonstrate commitment to the ISMS?',doc:'Management commitment evidence\nMeeting minutes'},'5.2':{name:'Policy',req:'Top management shall establish an information security policy that:\na) is appropriate to the purpose of the organization;\nb) includes information security objectives (see 6.2) or provides the framework for setting information security objectives; \nc) includes a commitment to satisfy applicable requirements related to information security; and\nd) includes a commitment to continual improvement of the information security management system.\nThe information security policy shall: \ne) be available as documented information; \nf) be communicated within the organization; and\ng) be available to interested parties, as appropriate.',q:'Is the information security policy approved and communicated?\nIs the policy reviewed at planned intervals?',doc:'Information Security Policy'},'5.3':{name:'Organizational roles, responsibilities and authorities',req:'Top management shall ensure that the responsibilities and authorities for roles relevant to information security are assigned and communicated.\nTop management shall assign the responsibility and authority for:\na) ensuring that the information security management system conforms to the requirements of this International Standard; and\nb) reporting on the performance of the information security management system to top management.',q:'Are information security roles and responsibilities assigned?',doc:'RACI matrix; Job descriptions\nOrg chart'},'6.1':{name:'Actions to address risks and opportunities',req:'General',q:'',doc:''},'6.1.2':{name:'Information security risk assessment',req:'The organization shall define and apply an information security risk assessment process that:\na) establishes and maintains information security risk criteria that include:\n1) the risk acceptance criteria; and\n2) criteria for performing information security risk assessments;\nb) ensures that repeated information security risk assessments produce consistent, valid and comparable results;\nc) identifies the information security risks:\n1) apply the information security risk assessment process to identify risks associated with the loss of confidentiality, integrity and availability for information within the scope of the information security management system; and\n2) identify the risk owners;\nd) analyses the information security risks:\n1) assess the potential consequences that would result if the risks identified in 6.1.2 c) 1) were to materialize;\n2) assess the realistic likelihood of the occurrence of the risks identified in 6.1.2 c) 1); and\n3) determine the levels of risk;\ne) evaluates the information security risks:\n1) compare the results of risk analysis with the risk criteria established in 6.1.2 a); and\n2) prioritise the analysed risks for risk treatment.\nThe organization shall retain documented information about the information security risk assessment process.',q:'Is there a defined risk assessment methodology?\nIs a current risk register maintained?',doc:'Risk register'},'6.1.3':{name:'Information security risk treatment',req:'The organization shall define and apply an information security risk treatment process to: \na) select appropriate information security risk treatment options, taking account of the risk assessment results;\nb) determine all controls that are necessary to implement the information security risk treatment option(s) chosen; \nNOTE: Organizations can design controls as required, or identify them from any source. \nc) compare the controls determined in 6.1.3 b) above with those in Annex A and verify that no necessary controls have been omitted;\nNOTE: Annex A contains a comprehensive list of control objectives and controls. Users of this International Standard are directed to Annex A to ensure that no necessary controls are overlooked.\nNOTE: Control objectives are implicitly included in the controls chosen. The control objectives and controls listed in Annex A are not exhaustive and additional control objectives and controls may be needed. \nd) produce a Statement of Applicability that contains the necessary controls (see 6.1.3 b) and c)) and justification for inclusions, whether they are implemented or not, and the justification for exclusions of controls from Annex A;\ne) formulate an information security risk treatment plan; and\nf) obtain risk owners’ approval of the information security risk treatment plan and acceptance of the residual information security risks.\nThe organization shall retain documented information about the information security risk treatment process.',q:'Is a risk treatment plan defined and implemented?\nIs a Statement of Applicability maintained and justified?',doc:'Risk treatment plan\nStatement of Applicability'},'6.2':{name:'Information security objectives and plans to achieve them',req:'The organization shall establish information security objectives at relevant functions and levels. \nThe information security objectives shall: \na) be consistent with the information security policy; \nb) be measurable (if practicable); \nc) take into account applicable information security requirements, and risk assessment and risk treatment results;\nd) be communicated; and\ne) be updated as appropriate. \nThe organization shall retain documented information on the information security objectives.\nWhen planning how to achieve its information security objectives, the organization shall determine: \nf) what will be done;\ng) what resources will be required;\nh) who will be responsible; \ni) when it will be completed; and\nj) how the results will be evaluated.',q:'Are measurable information security objectives defined?\nAre ISMS changes planned and controlled?',doc:'Security objectives document\nKPI list'},'6.3':{name:'Planning  of Changes',req:'When the organization determines the need for changes to the information security management system, the changes shall be carried out in a planned manner',q:'Are ISMS changes planned and controlled?',doc:''},'7.1':{name:'Resources',req:'The organization shall determine and provide the resources needed for the establishment, implementation, maintenance and continual improvement of the information security management system.',q:'Are sufficient resources allocated to maintain the ISMS?',doc:'Resource planning (optional)'},'7.2':{name:'Competence',req:'The organization shall:\na) determine the necessary competence of person(s) doing work under its control that affects its information security performance;\nb) ensure that these persons are competent on the basis of appropriate education, training, or experience;\nc) where applicable, take actions to acquire the necessary competence, and evaluate the effectiveness of the actions taken; and\nd) retain appropriate documented information as evidence of competence.',q:'Is competence of personnel evaluated and documented?',doc:'Training records\nCompetence matrix'},'7.3':{name:'Awareness',req:'Persons doing work under the organization\'s control shall be aware of: \na) the information security policy; \nb) their contribution to the effectiveness of the information security management system, including the benefits of improved information security performance; and\nc) the implications of not conforming with the information security management systems requirements.',q:'Is security awareness training conducted regularly?',doc:'Awareness materials\nTraining campaigns'},'7.4':{name:'Communication',req:'The organization shall determine the need for internal and external communications relevant to the information security management system including: \na) on what to communicate;\nb) when to communicate;\nc) with whom to communicate;\nd) who shall communicate; and\ne) the processes by which communication shall be effected.',q:'Is there a defined communication process for security matters?',doc:'Communication plan'},'7.5':{name:'Documented information',req:'General',q:'',doc:''},'7.5.2':{name:'Creating and updating',req:'When creating and updating documented information the organization shall ensure appropriate:\na) identification and description (e.g. a title, date, author, or reference number);\nb) format (e.g. language, software version, graphics) and media (e.g. paper, electronic); and\nc) review and approval for suitability and adequacy.',q:'Is documented information controlled and version managed?',doc:'Document templates\nVersion control approach'},'7.5.3':{name:'Control of documented information',req:'Documented information required by the information security management system and by this International Standard shall be controlled to ensure:\na) it is available and suitable for use, where and when it is needed; and\nb) it is adequately protected (e.g. from loss of confidentiality, improper use, or loss of integrity). \nFor the control of documented information, the organization shall address the following activities, as applicable:\nc) distribution, access, retrieval and use;\nd) storage and preservation, including the preservation of legibility;\ne) control of changes (e.g. version control); and\nf) retention and disposition.\nDocumented information of external origin, determined by the organization to be necessary for the planning and operation of the information security management system, shall be identified as appropriate, and controlled.',q:'Is documented information controlled and version managed?',doc:'Document control procedure\nAccess control on documents'},'8.1':{name:'Operational planning and control',req:'The organization shall plan, implement and control the processes needed to meet information security requirements, and to implement the actions determined in 6.1. The organization shall also implement plans to achieve information security objectives determined in 6.2.',q:'Are operational controls implemented as planned?',doc:'Operational procedures\nProcess descriptions'},'8.2':{name:'Information security risk assessment',req:'The organization shall perform information security risk assessments at planned intervals or when significant changes are proposed or occur, taking account of the criteria established in 6.1.2 a).\nThe organization shall retain documented information of the results of the information security risk assessments.',q:'Are risk assessments performed at planned intervals?',doc:'Updated risk assessments'},'8.3':{name:'Information security risk treatment',req:'The organization shall implement the information security risk treatment plan.\nThe organization shall retain documented information of the results of the information security risk treatment.',q:'Is the risk treatment plan implemented and monitored?',doc:'Implementation evidence\nAction tracking'},'9.1':{name:'Monitoring, measurement, analysis and evaluation',req:'The organization shall evaluate the information security performance and the effectiveness of the information security management system.\nThe organization shall determine: \na) what needs to be monitored and measured, including information security processes and controls; \nb) the methods for monitoring, measurement, analysis and evaluation, as applicable, to ensure valid results;\nNOTE: The methods selected should produce comparable and reproducible results to be considered valid.\nc) when the monitoring and measuring shall be performed; \nd) who shall monitor and measure;\ne) when the results from monitoring and measurement shall be analyzed and evaluated; and\nf) who shall analyse and evaluate these results.\nThe organization shall retain appropriate documented information as evidence of the monitoring and measurement results.',q:'Are security KPIs defined and monitored?',doc:'KPI reports \nDashboards'},'9.2':{name:'Internal audit',req:'The organization shall conduct internal audits at planned intervals to provide information on whether the information security management system: \na) conforms to \n1) the organization’s own requirements for its information security management system; and\n2) the requirements of this International Standard;\nb) is effectively implemented and maintained.\nThe organization shall: \nc) plan, establish, implement and maintain an audit programme(s), including the frequency, methods, responsibilities, planning requirements and reporting. \nThe audit programme(s) shall take into consideration the importance of the processes concerned and the results of previous audits;\nd) define the audit criteria and scope for each audit; \ne) select auditors and conduct audits that ensure objectivity and the impartiality of the audit process;\nf) ensure that the results of the audits are reported to relevant management; and\ng) retain documented information as evidence of the audit programme(s) and the audit results.',q:'Is an internal audit program established?\nAre internal audits conducted at planned intervals?',doc:'Audit plan\nAudit reports'},'9.3':{name:'Management review',req:'Top management shall review the organization\'s information security management system at planned intervals to ensure its continuing suitability, adequacy and effectiveness. \nThe management review shall include consideration of: \na) the status of actions from previous management reviews; \nb) changes in external and internal issues that are relevant to the information security management system;\nc) feedback on the information security performance, including trends in:\n1) nonconformities and corrective actions;\n2) monitoring and measurement results; \n3) audit results; and\n4) fulfilment of information security objectives;\nd) feedback from interested parties;\ne) results of risk assessment and status of risk treatment plan; and\nf) opportunities for continual improvement.\nThe outputs of the management review shall include decisions related to continual improvement opportunities and any needs for changes to the information security management system.\nThe organization shall retain documented information as evidence of the results of management reviews.',q:'Is management review conducted at planned intervals?\nAre review inputs and outputs documented?',doc:'Management review minutes'},'10.1':{name:'Nonconformity and corrective action',req:'When a nonconformity occurs, the organization shall:\na) react to the nonconformity, and as applicable: \n1) take action to control and correct it; and\n2) deal with the consequences;\nb) evaluate the need for action to eliminate the causes of nonconformity, in order that it does not recur or occur elsewhere, by:\n1) reviewing the nonconformity;\n2) determining the causes of the nonconformity; and\n3) determining if similar nonconformities exist, or could potentially occur;\nc) implement any action needed;\nd) review the effectiveness of any corrective action taken; and\ne) make changes to the information security management system, if necessary. \nCorrective actions shall be appropriate to the effects of the nonconformities encountered.\nThe organization shall retain documented information as evidence of: \nf) the nature of the nonconformities and any subsequent actions taken, and \ng) the results of any corrective action.',q:'Is continual improvement demonstrated?',doc:'Nonconformity log\nCorrective actions register'},'10.2':{name:'Continual improvement',req:'The organization shall continually improve the suitability, adequacy and effectiveness of the information security management system.',q:'Are nonconformities recorded and addressed?\nIs root cause analysis performed?\nIs corrective action effectiveness reviewed?',doc:'Improvement log\nLessons learned'}};

function loadDB(){
  try{var d=localStorage.getItem('rg_v7');if(d)DB=JSON.parse(d);}catch(e){}
  DB.impl=DB.impl||[]; DB.audit=DB.audit||[]; DB.gap=DB.gap||[];
  // Migrate: re-run detectMeta if control is blank or old group format
  var SPECIFIC_RE=/^(A\.\d+\.\d|Clause \d)/;
  DB.impl.forEach(function(c){
    (c.docs||[]).forEach(function(doc){
      if(!doc.name)return;
      if(!doc.control||!SPECIFIC_RE.test(doc.control)){
        var meta=detectMeta(doc.name);
        if(meta.ctrl)doc.control=meta.ctrl;
        if(meta.cat&&meta.cat!=='Overig'&&(!doc.category||doc.category==='Overig'))doc.category=meta.cat;
      }
    });
  });

}
function saveDB(){localStorage.setItem('rg_v7',JSON.stringify(DB));}

function ini(n){return n.split(' ').filter(Boolean).map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,2)||'?';}
function today(){return new Date().toISOString().slice(0,10);}

function implPct(c){var d=c.docs||[];if(!d.length)return 0;return Math.round(d.filter(function(x){return x.status==='approved';}).length/d.length*100);}
function auditPct(c){
  var aa=c.annexA||[];var ap=aa.filter(function(x){return x.applicable;});
  if(!ap.length)return 0;
  return Math.round(ap.filter(function(x){return x.status==='compliant';}).length/ap.length*100);
}
function clientPct(c){return ST.module==='impl'?implPct(c):ST.module==='audit'?auditPct(c):gapPct(c);}

function phasePct(c,ph){var d=(c.docs||[]).filter(function(x){return x.phase===ph;});if(!d.length)return{t:0,a:0,r:0,co:0,p:0};var a=d.filter(function(x){return x.status==='approved';}).length;var r=d.filter(function(x){return x.status==='review';}).length;var co=d.filter(function(x){return x.status==='concept';}).length;return{t:d.length,a:a,r:r,co:co,p:Math.round(a/d.length*100)};}
function filtered(docs){var s=ST.search.toLowerCase();return docs.filter(function(d){var ms=!s||d.name.toLowerCase().indexOf(s)>=0||(d.control||'').toLowerCase().indexOf(s)>=0;var mst=!ST.fSt||d.status===ST.fSt;var mc=!ST.fCat||d.category===ST.fCat;return ms&&mst&&mc;});}

function getMultiControls(docName){
  var f=(docName||'').toLowerCase().replace(/[_\-.]+/g,' ').trim();
  for(var i=0;i<MULTI_CTRL_MAP.length;i++){
    if(MULTI_CTRL_MAP[i].re.test(f)){
      return[MULTI_CTRL_MAP[i].ctrl].concat(MULTI_CTRL_MAP[i].also||[]);
    }
  }
  // Fallback: run detectMeta and return just primary ctrl
  var m=detectMeta(docName);
  return m.ctrl?[m.ctrl]:[];
}

function render(){
  var bc=document.getElementById('topbar-bc');
  var act=document.getElementById('topbar-act');
  var con=document.getElementById('content');
  var nav_impl=document.getElementById('nav-impl');
  var nav_audit=document.getElementById('nav-audit');
  var nav_gap=document.getElementById('nav-gap');
  if(nav_impl)nav_impl.className='nav-item'+(ST.module==='impl'?' active':'');
  if(nav_audit)nav_audit.className='nav-item'+(ST.module==='audit'?' active':'');
  if(nav_gap)nav_gap.className='nav-item'+(ST.module==='gap'?' active':'');
  // Schedule auto-resize after DOM update
  setTimeout(function(){document.querySelectorAll('textarea[oninput*="autoResize"]').forEach(function(ta){autoResize(ta);});},10);

  if(ST.view==='clients'){
    var lbl=ST.module==='impl'?'Implementatie \u2014 Klantoverzicht':ST.module==='audit'?'Internal Audit \u2014 Klantoverzicht':'Gap Assessment \u2014 Klantoverzicht';
    bc.innerHTML='<span class="bc-cur">'+lbl+'</span>';
    act.innerHTML='<button class="btn btn-primary" onclick="openModal(\'addClient\')">+ Klant toevoegen</button>';
    con.innerHTML=renderClients();
  } else {
    var c=clients()[ST.sel];
    if(!c){goHome();return;}
    var modLbl=ST.module==='impl'?'Implementatie':'Internal Audit';
    bc.innerHTML='<button class="bc-link" onclick="goHome()">'+modLbl+'</button><span class="bc-sep">&#8250;</span><span class="bc-cur">'+c.name+'</span>';
    if(ST.module==='impl'){
      act.innerHTML='<button class="btn" onclick="openModal(\'importDocs\')">&#128193; Map importeren vanuit SharePoint</button>';
      con.innerHTML=renderImplDetail();
      if(ST.tab==='docs')attachSearchEvents();
    } else if(ST.module==='audit') {
      act.innerHTML='<button class="btn" onclick="exportAuditWord()">&#8595; Word rapport</button>';
      con.innerHTML=renderAuditDetail();
    } else {
      act.innerHTML='<button class="btn" onclick="exportGapExcel()">&#8595; Excel export</button>';
      con.innerHTML=renderGapDetail();
    }
  }
}

    return '<div class="empty"><div class="empty-icon">&#9672;</div><div class="empty-title">Nog geen klanten</div><div class="empty-sub">Voeg een klant toe om te beginnen met '+lbl+'.</div><button class="btn btn-primary" onclick="openModal(\'addClient\')">+ Eerste klant toevoegen</button></div>';
  }
  var h='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem"><div><div style="font-size:20px;font-weight:600">'+( ST.module==='impl'?'Implementatie':ST.module==='audit'?'Internal Audit':'Gap Assessment')+'</div><div style="font-size:13px;color:var(--text-muted);margin-top:3px">'+cl.length+' klant'+(cl.length!==1?'en':'')+'</div></div></div><div class="client-grid">';
  cl.forEach(function(c,i){
    var p=clientPct(c);var docs=c.docs||[];var apr=docs.filter(function(d){return d.status==='approved';}).length;
    var sublbl=ST.module==='impl'?(apr+'/'+docs.length+' goedgekeurd'):ST.module==='audit'?( (c.annexA||[]).filter(function(x){return x.applicable;}).length+' controls applicable'):((c.findings||[]).length+' bevindingen');
    h+='<div class="client-card" onclick="openClient('+i+')">'+
      '<button class="card-del" onclick="event.stopPropagation();delClient('+i+')">&#x2715;</button>'+
      '<button class="card-menu" onclick="event.stopPropagation();toggleCardMenu('+i+',this)">&#8943;</button>'+
      '<div class="card-dropdown" id="cdm-'+i+'" onclick="event.stopPropagation()">'+
        '<button onclick="closeCardMenus();openModal(\'editClient\','+i+')">&#9998;&nbsp; Hernoemen</button>'+
        '<div class="dd-divider"></div>'+
        '<button class="dd-next" onclick="closeCardMenus();startNextPhase('+i+')">&#8594;&nbsp; Starten volgende fase</button>'+
      '</div>'+
      '<div class="c-avatar">'+ini(c.name)+'</div><div class="c-name">'+c.name+'</div><div class="c-phase">'+(c.phase||'Fase niet ingesteld')+'</div><div class="pbar"><div class="pbar-fill" style="width:'+p+'%"></div></div><div class="pbar-label">'+sublbl+' &middot; '+p+'%</div><div class="open-hint">openen &rarr;</div></div>';
  });
  return h+'</div>';
}

function renderScopeCard(c){
  var ci=clients().indexOf(c);
  var meta=[];
  if(c.sector)meta.push({lbl:'Sector',val:c.sector});
  if(c.size)meta.push({lbl:'Medewerkers',val:c.size});
  if(c.certDate)meta.push({lbl:'Certificeringsdatum',val:c.certDate});
  var scopeDocs=c.scopeDocs||[];
  var h='<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:1.25rem;box-shadow:var(--sh)">';
  h+='<div style="display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;margin-bottom:10px">';
  meta.forEach(function(it){
    h+='<div><div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">'+it.lbl+'</div>';
    h+='<div style="font-size:13px;color:var(--text);font-weight:500">'+it.val+'</div></div>';
  });
  h+='<button class="btn btn-sm" onclick="openModal(\'editClient\','+ci+')" style="margin-left:auto">&#9998; Bewerken</button></div>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">';
  h+='<span style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-right:4px">Documenten</span>';
  if(scopeDocs.length){
    scopeDocs.forEach(function(d,di){
      var inner=d.link
        ?'<a href="'+d.link+'" target="_blank" style="color:var(--blue);font-weight:500;text-decoration:none;font-size:12px">&#128196; '+d.name+' &#8599;</a>'
        :'<span style="font-size:12px;font-weight:500;color:var(--text)">&#128196; '+d.name+'</span>';
      h+='<div style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--blue-light);border:1px solid #B5D4F4;border-radius:20px">'+inner+
        '<button onclick="removeScopeDoc('+ci+','+di+')" style="background:none;border:none;cursor:pointer;color:#888;font-size:11px;padding:0;line-height:1" title="Verwijderen">&#x2715;</button></div>';
    });
  } else {
    h+='<span style="font-size:12px;color:var(--text-muted);font-style:italic">Geen documenten gekoppeld</span>';
  }
  h+='<button class="btn btn-sm" onclick="openModal(\'addScopeDoc\','+ci+')" style="margin-left:4px">+ Koppelen</button>';
  h+='</div></div>';
  return h;
}
function renderImplDetail(){
  var c=clients()[ST.sel];
  // Count docs across all domains
  var allDomDocs=(c.domains||[]).reduce(function(a,d){return a.concat(d.docs||[]);}, []);
  var apr=allDomDocs.filter(function(d){return d.status==='approved';}).length;
  var rev=allDomDocs.filter(function(d){return d.status==='review';}).length;
  var con=allDomDocs.filter(function(d){return !d.status||d.status==='concept';}).length;
  var total=allDomDocs.length;
  var p=total?Math.round(apr/total*100):0;
  var h='<div class="det-hdr"><div class="det-avatar">'+ini(c.name)+'</div><div style="flex:1"><div class="det-name">'+c.name+'</div><div class="det-sub">'+(c.contact?c.contact+' &middot; ':'')+( c.phase||'Fase niet ingesteld')+'</div></div></div>';
  h+=renderScopeCard(c);
  h+='<div class="prog-hdr"><div class="prog-pct">'+p+'%</div><div class="prog-trk"><div class="prog-lbl">Totale voortgang &mdash; '+apr+' van '+total+' documenten goedgekeurd</div><div class="prog-bar"><div class="prog-fill" style="width:'+p+'%"></div></div></div></div>';
  h+='<div class="stats-row"><div class="stat-card"><div class="stat-val" style="color:#0F6E56">'+apr+'</div><div class="stat-lbl">Goedgekeurd</div></div><div class="stat-card"><div class="stat-val" style="color:var(--amber)">'+rev+'</div><div class="stat-lbl">In review</div></div><div class="stat-card"><div class="stat-val" style="color:#5F5E5A">'+con+'</div><div class="stat-lbl">Concept</div></div><div class="stat-card"><div class="stat-val" style="color:var(--blue)">'+total+'</div><div class="stat-lbl">Totaal</div></div></div>';
  h+='<div class="tabs"><button class="tab'+(ST.tab==='domains'?' active':'')+'" onclick="setTab(\'domains\')">Domeinen</button><button class="tab'+(ST.tab==='notes'?' active':'')+'" onclick="setTab(\'notes\')">Notities</button></div>';
  if(ST.tab==='domains')h+=renderDomainsTab(c);
  else h+=renderNotesTab();
  return h;
}

function renderDocsTab(docs){
  var fd=filtered(docs);

  if(!docs.length){h+='<div class="empty"><div class="empty-icon">&#128196;</div><div class="empty-title">Nog geen documenten</div><div class="empty-sub">Voeg documenten toe of importeer een map.</div><div style="display:flex;gap:8px;justify-content:center"><button class="btn" onclick="openModal(\'importDocs\')">&#128193; Map importeren</button><button class="btn btn-primary" onclick="openModal(\'addDoc\',null)">+ Document toevoegen</button></div></div>';}
  else if(!fd.length){h+='<div class="empty"><div class="empty-icon">&#128269;</div><div class="empty-title">Geen resultaten</div></div>';}

function getCtrlInfoBtn(ctrl){
  if(!ctrl)return'';
  var isA=ctrl.charAt(0)==='A'&&ctrl.charAt(1)==='.';
  var key=isA?ctrl.split('.').slice(0,3).join('.'):ctrl.replace('Clause ','');
  var d=isA?aDesc(key):(CLAUSE_DESC[key]||{});
  var type=isA?'annex':'clause';
  return'<button class="btn btn-sm" title="Control omschrijving" onclick="event.stopPropagation();showControlDesc(\''+type+'\',\''+encodeURIComponent(ctrl)+'\',\''+encodeURIComponent(d.desc||d.req||ctrl)+'\',\''+encodeURIComponent(d.q||'')+'\',\''+encodeURIComponent(d.doc||'')+'\',\''+encodeURIComponent(ctrl)+'\')">&#9432;</button>';
}

function buildDocRows(fd,docs){
  var rows='';
  fd.forEach(function(d){
    var i=docs.indexOf(d);
    var bc=d.status==='approved'?'b-approved':d.status==='review'?'b-review':'b-concept';
    var dc=d.status==='approved'?'d-approved':d.status==='review'?'d-review':'d-concept';
    var bl=d.status==='approved'?'Goedgekeurd':d.status==='review'?'In review':'Concept';
    var fileIcon=d.link?'<span style="display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:10px;padding:2px 6px;border-radius:10px;background:#E1F5EE;color:#0F6E56;font-weight:600;vertical-align:middle">&#128196; bestand</span>':'<span style="display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:10px;padding:2px 6px;border-radius:10px;background:#F0F4F8;color:#5A6B7E;font-weight:500;vertical-align:middle">&#128462; geen bestand</span>';
    var nm=d.link?'<a class="doc-link" href="'+d.link+'" target="_blank">'+d.name+'</a>'+fileIcon:'<span style="font-weight:500">'+d.name+'</span>'+fileIcon;
    var noteVal=(d.note||'').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    var _ic=d.control||'';
    var icinfoBtn=_ic?getCtrlInfoBtn(_ic):'';
    rows+='<tr><td>'+nm+'</td><td><span class="tag">'+( d.category||'\u2014')+'</span></td><td style="display:flex;align-items:center;gap:4px"><span class="mono">'+(d.control||'\u2014')+'</span>'+icinfoBtn+'</td><td><span class="badge '+bc+'"><span class="sdot '+dc+'"></span>'+bl+'</span></td><td><span style="font-size:11px;color:var(--text-muted)">'+(d.date||'\u2014')+'</span></td><td style="display:flex;gap:5px"><button class="btn btn-sm" onclick="cycleStatus('+i+')" title="Volgende status" style="font-size:13px">&#8635;</button><button class="btn btn-sm btn-edit" onclick="openModal(\'addDoc\','+i+')" title="Bewerken">&#9998;</button><button class="btn btn-sm btn-danger" onclick="delDoc('+i+')">&#x2715;</button></td></tr>';
    var hasNote=d.note&&d.note.trim()!=='';
    var noteBtn='<button onclick="toggleDocNote(\'note-'+i+'\')" style="background:none;border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:11px;cursor:pointer;color:var(--text-muted);">'+(hasNote?'&#128221; notitie':'+ notitie')+'</button>';
    rows=rows.replace(/<\/tr>$/,'<td>'+noteBtn+'<\/td><\/tr>');
    var noteOpen=ST.openNotes['note-'+i]?'':'none';
    rows+='<tr id="note-'+i+'" style="display:'+noteOpen+';background:#F7FAFD"><td colspan="7" style="padding:4px 14px 8px"><textarea placeholder="Notitie bij document..." onchange="saveDocNote('+i+',this.value)" style="width:100%;min-height:50px;padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:var(--white);font-family:DM Sans,sans-serif;color:var(--text);resize:vertical;line-height:1.5">'+noteVal+'</textarea></div></td></tr>';
  });
  return rows;
}

function toggleDomain(di){
  if(!ST.openDomains)ST.openDomains={};
  ST.openDomains[di]=!ST.openDomains[di];
  render();
}

function delDomain(di){
  var c=clients()[ST.sel];if(!c)return;
  var dom=c.domains[di];
  if(!confirm('Domein "'+dom.name+'" verwijderen?\n'+(dom.docs&&dom.docs.length?dom.docs.length+' document(en) gaan mee verloren.':'Domein is leeg.')))return;
  c.domains.splice(di,1);
  if(ST.openDomains){delete ST.openDomains[di];}
  saveDB();render();
}

function cycleDomainDocStatus(di,doci){
  var c=clients()[ST.sel];if(!c)return;
  var doc=c.domains[di].docs[doci];
  var cycle=['concept','review','approved'];
  var cur=cycle.indexOf(doc.status||'concept');
  doc.status=cycle[(cur+1)%cycle.length];
  doc.date=today();
  saveDB();render();
}

function delDomainDoc(di,doci){
  var c=clients()[ST.sel];if(!c)return;
  var doc=c.domains[di].docs[doci];
  if(!confirm('Document "'+doc.name+'" verwijderen?'))return;
  c.domains[di].docs.splice(doci,1);
  saveDB();render();
}

function saveDomainDoc(di,doci){
  var c=clients()[ST.sel];if(!c)return;
  var name=(document.getElementById('dd-name')||{}).value||'';
  if(!name.trim())return;
  var link=((document.getElementById('dd-link')||{}).value||'').trim();
  var cat=((document.getElementById('dd-cat')||{}).value||'').trim();
  var status=(document.getElementById('dd-status')||{}).value||'concept';
  var cbs=document.querySelectorAll('.dd-ctrl-cb:checked');
  var ctrls=[];cbs.forEach(function(cb){ctrls.push(cb.value);});
  var doc={name:name.trim(),link:link,controls:ctrls,category:cat,status:status,date:today()};
  if(doci!==null&&doci!==undefined){
    c.domains[di].docs[doci]=doc;
  } else {
    c.domains[di].docs.push(doc);
    if(ST.openDomains)ST.openDomains[di]=true;
  }
  saveDB();closeModal();render();
}

function saveDomainEdit(di){
  var c=clients()[ST.sel];if(!c)return;
  var name=(document.getElementById('de-name')||{}).value||'';
  if(!name.trim())return;
  var ctrls=[];
  var ctrlEls=document.querySelectorAll('.de-ctrl-cb:checked');
  ctrlEls.forEach(function(el){ctrls.push(el.value);});
  var customVal=((document.getElementById('de-custom-ctrl')||{}).value||'').trim();
  if(customVal){customVal.split(',').forEach(function(v){var t=v.trim();if(t&&ctrls.indexOf(t)===-1)ctrls.push(t);});}
  c.domains[di].name=name.trim();

function renderAuditClausules(c){
  var groups=[{label:'Clause 4 \u2014 Context',from:'4.',to:'5.'},{label:'Clause 5 \u2014 Leadership',from:'5.',to:'6.'},{label:'Clause 6 \u2014 Planning',from:'6.',to:'7.'},{label:'Clause 7 \u2014 Support',from:'7.',to:'8.'},{label:'Clause 8 \u2014 Operation',from:'8.',to:'9.'},{label:'Clause 9 \u2014 Performance evaluation',from:'9.',to:'10.'},{label:'Clause 10 \u2014 Improvement',from:'10.',to:'99.'}];
  var h='';
  groups.forEach(function(g){
    var rows=c.clauses.filter(function(cl){return cl.id>=g.from&&cl.id<g.to;});
    if(!rows.length)return;
    var conf=rows.filter(function(r){return r.status==='compliant';}).length;
    var pct=Math.round(conf/rows.length*100);
    h+='<div class="audit-grp-hdr">'+g.label+'<span class="grp-pct">'+conf+'/'+rows.length+' conform &middot; '+pct+'%</span></div>';
    h+='<div class="tbl-wrap" style="margin-bottom:16px"><table style="table-layout:fixed"><colgroup><col style="width:65px"><col style="width:25%"><col style="width:40%"><col style="width:95px"><col style="width:38px"></colgroup><thead><tr><th>Clause</th><th>Requirement</th><th>Bewijs document</th><th>Status</th><th></th></tr></thead><tbody>';
    rows.forEach(function(cl,li){
      var ri=c.clauses.indexOf(cl);
      var bc=cl.status==='compliant'?'b-compliant':cl.status==='ofi'?'b-ofi':cl.status==='minor'?'b-minor':cl.status==='major'?'b-major':cl.status==='gap'?'b-gap':'b-open';
      var bl=cl.status==='compliant'?'Compliant':cl.status==='ofi'?'OFI':cl.status==='minor'?'Minor NC':cl.status==='major'?'Major NC':cl.status==='gap'?'GAP':'Open';
      var docCell=cl.docLink?'<a class="doc-link" href="'+cl.docLink+'" target="_blank">'+(cl.docName||cl.doc)+' &#8599;</a>':(cl.docName||'<span style="color:var(--text-muted)">'+cl.doc+'</span>');
      var cdesc=CLAUSE_DESC[cl.id]||{};
      h+='<tr style="cursor:pointer" onclick="showControlDesc(\'clause\',\''+cl.id+'\',\''+encodeURIComponent(cdesc.req||cl.name)+'\',\''+encodeURIComponent(cdesc.q||'')+'\',\''+encodeURIComponent(cdesc.doc||cl.doc||'')+'\',\''+encodeURIComponent(cl.name||'')+'\')"><td><span class="mono">'+cl.id+'</span></td><td style="font-weight:500;font-size:12px">'+cl.name+'</td><td style="font-size:12px">'+docCell+'</td><td><span class="badge '+bc+'">'+bl+'</span></td><td><button class="btn btn-sm btn-edit" onclick="event.stopPropagation();openModal(\'editAuditItem\',{type:\'clause\',idx:'+ri+'})">&#9998;</button></td></tr>';
    });

  return h;

function renderAuditAnnexA(c){
  var groups=['A.5','A.6','A.7','A.8'];
  var labels={'A.5':'A.5 \u2014 Organisational controls (37)','A.6':'A.6 \u2014 People controls (8)','A.7':'A.7 \u2014 Physical controls (14)','A.8':'A.8 \u2014 Technological controls (34)'};

function buildAuditAnnexGrp(c){
  var rows=c.annexA.filter(function(x){return x.group===ST.auditGrp;});
  var ap=rows.filter(function(x){return x.applicable;});
  var conf=ap.filter(function(x){return x.status==='compliant';}).length;
  var h='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><div style="font-size:13px;color:var(--text-muted)">'+ap.length+' applicable &middot; '+conf+' conform</div><button class="btn btn-sm" onclick="toggleAllApplicable()">Alles aan/uit</button></div>';
  h+='<div class="tbl-wrap"><table style="table-layout:fixed"><colgroup><col style="width:58px"><col style="width:24%"><col style="width:58px"><col style="width:38%"><col style="width:95px"><col style="width:38px"></colgroup><thead><tr><th>ID</th><th>Control</th><th>Appl.</th><th>Bewijs document</th><th>Status</th><th></th></tr></thead><tbody>';
  rows.forEach(function(ctrl){
    var ri=c.annexA.indexOf(ctrl);
    var bc=!ctrl.applicable?'b-na':ctrl.status==='compliant'?'b-compliant':ctrl.status==='ofi'?'b-ofi':ctrl.status==='minor'?'b-minor':ctrl.status==='major'?'b-major':'b-open';
    var bl=!ctrl.applicable?'N/A':ctrl.status==='compliant'?'Compliant':ctrl.status==='ofi'?'OFI':ctrl.status==='minor'?'Minor NC':ctrl.status==='major'?'Major NC':'Open';
    var docCell=ctrl.docLink?'<a class="doc-link" href="'+ctrl.docLink+'" target="_blank">'+(ctrl.docName||ctrl.doc)+' &#8599;</a>':(ctrl.docName||'<span style="color:var(--text-muted);font-size:11px">'+ctrl.doc+'</span>');
    var adesc=aDesc(ctrl.id);
    h+='<tr'+(ctrl.applicable?' style="cursor:pointer" onclick="showControlDesc(\'annex\',\''+ctrl.id+'\',\''+encodeURIComponent(adesc.desc||ctrl.name)+'\',\'\',\''+encodeURIComponent(adesc.doc||ctrl.doc||'')+'\',\''+encodeURIComponent(ctrl.name||'')+'\')"':' class="na-row"')+'>';
    h+='<td><span class="mono">'+ctrl.id+'</span></td>';
    h+='<td style="font-size:12px;font-weight:500">'+ctrl.name+'</td>';
    h+='<td><label class="soa-toggle" onclick="event.stopPropagation();toggleApplicable('+ri+')"><div class="toggle-box'+(ctrl.applicable?' on':'')+'"><div class="toggle-dot"></div></div></label></td>';
    h+='<td style="font-size:12px">'+docCell+'</td>';
    h+='<td>'+(ctrl.applicable?'<span class="badge '+bc+'">'+bl+'</span>':'')+'</td>';
    h+='<td>'+(ctrl.applicable?'<button class="btn btn-sm btn-edit" onclick="event.stopPropagation();openModal(\'editAuditItem\',{type:\'annex\',idx:'+ri+'})">&#9998;</button>':'')+'</td>';
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}

function renderAuditGrp(){
  var c=clients()[ST.sel];
  var el=document.getElementById('audit-grp-content');
  if(el)el.innerHTML=buildAuditAnnexGrp(c);
  // update group buttons
  var btns=document.querySelectorAll('[onclick^="ST.auditGrp"]');

    var g=b.getAttribute('onclick').match(/\'([^\']+)\'/)[1];
    b.className='btn btn-sm'+(ST.auditGrp===g?' btn-primary':'');

}

function toggleApplicable(ri){
  var c=clients()[ST.sel];
  c.annexA[ri].applicable=!c.annexA[ri].applicable;
  if(!c.annexA[ri].applicable)c.annexA[ri].status='';
  saveDB();renderAuditGrp();
}

function toggleAllApplicable(){
  var c=clients()[ST.sel];
  var rows=c.annexA.filter(function(x){return x.group===ST.auditGrp;});
  var allOn=rows.every(function(x){return x.applicable;});
  rows.forEach(function(x){x.applicable=!allOn;if(allOn)x.status='';});
  saveDB();renderAuditGrp();
}

function saveAuditItem(){
  var it=ST.mdata;var c=clients()[ST.sel];
  var item=it.type==='clause'?c.clauses[it.idx]:c.annexA[it.idx];
  item.docName=(document.getElementById('ai-dn')||{}).value||'';
  item.docLink=(document.getElementById('ai-dl')||{}).value||'';
  item.status=(document.getElementById('ai-st')||{}).value||'';
  item.finding=(document.getElementById('ai-find')||{}).value||'';
  item.improvement=(document.getElementById('ai-imp')||{}).value||'';
  saveDB();closeModal();render();
}

function saveAuditPlan(field,val){
  var c=clients()[ST.sel];if(!c)return;
  if(!c.auditPlan)c.auditPlan={};
  c.auditPlan[field]=val;saveDB();
}

function addInterviewee(){
  var c=clients()[ST.sel];if(!c)return;
  if(!c.auditPlan)c.auditPlan={};
  if(!c.auditPlan.interviewees_list)c.auditPlan.interviewees_list=[];
  c.auditPlan.interviewees_list.push({name:'',role:''});
  saveDB();render();
}

function removeInterviewee(idx){
  var c=clients()[ST.sel];if(!c||!c.auditPlan||!c.auditPlan.interviewees_list)return;
  c.auditPlan.interviewees_list.splice(idx,1);
  saveDB();render();
}

function saveInterviewee(idx,field,val){
  var c=clients()[ST.sel];if(!c||!c.auditPlan||!c.auditPlan.interviewees_list)return;
  c.auditPlan.interviewees_list[idx][field]=val;
  saveDB();
}

function saveNewDomain(){
  var name=(document.getElementById('dom-name')||{}).value||'';
  if(!name.trim())return;
  var c=clients()[ST.sel];if(!c)return;
  c.domains=c.domains||[];
  if(c.domains.some(function(d){return d.name===name.trim();})){
    alert('Een domein met deze naam bestaat al.');return;
  }
  c.domains.push({name:name.trim(),docs:[],controls:(DOMAIN_CTRL_MAP[name.trim()]||[]).slice()});
  saveDB();closeModal();render();
}

function moveInboxToDomain(ii,diStr){
  if(diStr==='')return;
  var di=parseInt(diStr);
  var c=clients()[ST.sel];if(!c||!c.inbox)return;
  var doc=c.inbox[ii];
  if(!doc)return;

function startNextPhase(i){
  var moduleOrder=['gap','impl','audit'];
  var moduleLabels={'gap':'GAP Assessment','impl':'Implementatie','audit':'Internal Audit'};
  var cur=ST.module;
  var curIdx=moduleOrder.indexOf(cur);
  if(curIdx===-1||curIdx===moduleOrder.length-1){alert('Dit is al de laatste fase.');return;}
  var nextModule=moduleOrder[curIdx+1];
  var nextLabel=moduleLabels[nextModule];
  var c=DB[cur][i];

  var exists=DB[nextModule].some(function(x){return x.name===c.name;});
  if(exists){
    var choice=window.confirm(
      'Klant "'+c.name+'" bestaat al in '+nextLabel+'.\n\n'+
      'Klik OK om samen te voegen (bestaande data blijft behouden, nieuwe data wordt toegevoegd).\n'+
      'Klik Annuleren om te stoppen.'
    );
    if(!choice)return;
    // Merge: keep existing record, just add missing items rather than overwrite
    var existingIdx=DB[nextModule].findIndex(function(x){return x.name===c.name;});
    var existing=DB[nextModule][existingIdx];
    // Merge noteLog (append new entries not already present)
    var existingNotes=existing.noteLog||[];
    var newNotes=(c.noteLog||[]).filter(function(n){
      return !existingNotes.some(function(e){return e.date===n.date&&e.text===n.text;});
    });
    existing.noteLog=(existingNotes).concat(newNotes);
    // For impl: merge docs (add docs not already present by name)
    if(nextModule==='impl'){
      existing.docs=existing.docs||[];
      // Build new docs list from GAP data
      var newDocs=[];
      (c.gapControls||[]).forEach(function(ctrl){
        if(!ctrl.applicable||!ctrl.status||ctrl.status==='compliant')return;
        var tmpl=ANNEX_A_TEMPLATE.filter(function(t){return t.id===ctrl.id;})[0];
        var docName=tmpl?tmpl.doc:ctrl.name;
        if(!existing.docs.some(function(d){return d.name===docName;})){
          newDocs.push({name:docName,link:'',category:(function(g){return g==='A.5'?'Policy':g==='A.6'?'Procedure':g==='A.7'?'Policy':'Policy';})(ctrl.group||'A.5'),controls:[(function(id){if(/^A\.[5678]\./.test(id))return id;if(/^[5678]\./.test(id))return'A.'+id;return'Clause '+id;})(ctrl.id)],phase:PHASES[1],status:'concept',date:today(),note:'Control: '+ctrl.id+(ctrl.gap?' | Gap: '+ctrl.gap:'')+(ctrl.currentState?' | Huidig: '+ctrl.currentState:'')});
        }
      });
      (c.gapClauses||[]).forEach(function(cl){
        if(!cl.status||cl.status==='compliant')return;
        var tmpl=CLAUSES_TEMPLATE.filter(function(t){return t.id===cl.id;})[0];
        var docName=tmpl?tmpl.doc:cl.name;
        if(!existing.docs.some(function(d){return d.name===docName;})){
          newDocs.push({name:docName,link:'',category:'Policy',control:'Clause '+cl.id,phase:PHASES[1],status:'concept',date:today(),note:'Clausule: '+cl.id+(cl.gap?' | Gap: '+cl.gap:'')+(cl.currentState?' | Huidig: '+cl.currentState:'')});
        }
      });
      existing.docs=existing.docs.concat(newDocs);
      (c.findings||[]).forEach(function(f){
        existing.noteLog.push({date:f.date||today(),text:'[GAP Bevinding] '+f.domain+(f.control?' — '+f.control:'')+': '+(f.description||'')});
      });
    }
    saveDB();switchModule(nextModule);
    return;
  }
  if(!confirm('Klant "'+c.name+'" doorzetten van '+moduleLabels[cur]+' naar '+nextLabel+'?\nAlle relevante data wordt automatisch meegenomen.'))return;

  var base={name:c.name,contact:c.contact||'',phase:c.phase||'',noteLog:c.noteLog?JSON.parse(JSON.stringify(c.noteLog)):[]};

  // ── GAP → IMPLEMENTATIE ────────────────────────────────────────────────────
  if(cur==='gap'&&nextModule==='impl'){
    var docs=[];

    // Helper: determine category from control group
    function catFromGroup(grp){
      if(grp==='A.5')return 'Policy';
      if(grp==='A.6')return 'Procedure';
      if(grp==='A.7')return 'Policy';
      if(grp==='A.8')return 'Policy';
      return 'Overig';
    }

    // Annex A controls met gap/ofi/minor/major → document per control, naam = doc field
    (c.gapControls||[]).forEach(function(ctrl){
      if(!ctrl.applicable||!ctrl.status||ctrl.status==='compliant')return;
      // Use the doc name from ANNEX_A_TEMPLATE
      var tmpl=ANNEX_A_TEMPLATE.filter(function(t){return t.id===ctrl.id;})[0];
      var docName=tmpl?tmpl.doc:ctrl.name;
      var grp=ctrl.group||'A.5';
      var ctrlLabel=grp+' — '+(grp==='A.5'?'Organisational':grp==='A.6'?'People':grp==='A.7'?'Physical':'Technological');
      docs.push({
        name:docName,
        link:'',
        category:catFromGroup(grp),
        controls:[(function(id){if(/^A.[5678]./.test(id))return id;if(/^[5678]./.test(id))return'A.'+id;return'Clause '+id;})(ctrl.id)],
        phase:PHASES[1],
        status:'concept',
        date:today(),
        note:'Control: '+ctrl.id+(ctrl.gap?' | Gap: '+ctrl.gap:'')+(ctrl.currentState?' | Huidig: '+ctrl.currentState:'')
      });
    });

    // Clausules met afwijking → document per clausule, naam = doc field
    (c.gapClauses||[]).forEach(function(cl){
      if(!cl.status||cl.status==='compliant')return;
      var tmpl=CLAUSES_TEMPLATE.filter(function(t){return t.id===cl.id;})[0];
      var docName=tmpl?tmpl.doc:cl.name;
      docs.push({
        name:docName,
        link:'',
        category:'Policy',
        control:'Clause '+cl.id,
        phase:PHASES[1],
        status:'concept',
        date:today(),
        note:'Clausule: '+cl.id+(cl.gap?' | Gap: '+cl.gap:'')+(cl.currentState?' | Huidig: '+cl.currentState:'')
      });
    });

    // Bevindingen → notitielogboek
    (c.findings||[]).forEach(function(f){
      base.noteLog.push({date:f.date||today(),text:'[GAP Bevinding] '+f.domain+(f.control?' — '+f.control:'')+': '+(f.description||'')});
    });

    base.docs=docs;
  }

  // ── IMPLEMENTATIE → AUDIT ──────────────────────────────────────────────────
  else if(cur==='impl'&&nextModule==='audit'){
    var annexA=freshAnnex();
    var auditClauses=freshClauses();

    // Build lookup: doc name → {docName, docLink, status}
    var docByName={};
    (c.docs||[]).forEach(function(doc){
      docByName[doc.name.toLowerCase().trim()]={docName:doc.name,docLink:doc.link||'',approved:doc.status==='approved'};
    });

    // Match Annex A: use the doc field from template for exact matching
    annexA.forEach(function(a){
      var tmpl=ANNEX_A_TEMPLATE.filter(function(t){return t.id===a.id;})[0];
      if(!tmpl)return;
      // Try exact doc name match
      var key=tmpl.doc.toLowerCase().trim();
      var match=docByName[key];
      if(match&&match.approved){
        a.docName=match.docName;
        a.docLink=match.docLink;
      }
      // Also try by control reference (group match for approved docs)
      if(!a.docName){
        var grp=a.group;
        var ctrlLabel=grp+' — '+(grp==='A.5'?'Organisational':grp==='A.6'?'People':grp==='A.7'?'Physical':'Technological');
        (c.docs||[]).forEach(function(doc){
          var _dc1=Array.isArray(doc.controls)?doc.controls:(doc.control?[doc.control]:[]);if(_dc1.indexOf(ctrlLabel)!==-1&&doc.status==='approved'&&!a.docName){
            a.docName=doc.name;a.docLink=doc.link||'';
          }
        });
      }
    });

    // Match Clauses: use doc field from template
    auditClauses.forEach(function(cl){
      var tmpl=CLAUSES_TEMPLATE.filter(function(t){return t.id===cl.id;})[0];
      if(!tmpl)return;
      var key=tmpl.doc.toLowerCase().trim();
      var match=docByName[key];
      if(match&&match.approved){
        cl.docName=match.docName;
        cl.docLink=match.docLink;
      }
      // Also try clause number match
      if(!cl.docName){
        var pfx='Clause '+cl.id.split('.')[0];
        (c.docs||[]).forEach(function(doc){
          var _dc2=Array.isArray(doc.controls)?doc.controls:(doc.control?[doc.control]:[]);if(_dc2.indexOf(pfx)!==-1&&doc.status==='approved'&&!cl.docName){
            cl.docName=doc.name;cl.docLink=doc.link||'';
          }
        });
      }
    });

    // Niet-goedgekeurde docs als notitie
    var openDocs=(c.docs||[]).filter(function(d){return d.status!=='approved';});
    if(openDocs.length)
      base.noteLog.push({date:today(),text:'[Uit Implementatie] Nog niet goedgekeurd: '+openDocs.map(function(d){return d.name;}).join(', ')});

    base.annexA=annexA;
    base.clauses=auditClauses;
    base.findings=[];
    base.interview={};
  }

  // ── Fallback ───────────────────────────────────────────────────────────────
  else {
    if(nextModule==='impl')base.docs=[];
    else{base.annexA=freshAnnex();base.clauses=freshClauses();base.findings=[];base.interview={};}
  }

  DB[nextModule].push(base);saveDB();
  ST.module=nextModule;ST.view='clients';ST.sel=null;render();
  setTimeout(function(){
    document.querySelectorAll('.client-card .c-name').forEach(function(el){
      if(el.textContent===c.name){
        el.closest('.client-card').style.outline='2px solid var(--blue)';
        setTimeout(function(){el.closest('.client-card').style.outline='';},2000);
      }
    });
  },100);
}

function parseSharePointUrl(url){
  // Extract site + drive path from SharePoint URL
  // e.g. https://tenant.sharepoint.com/sites/SiteName/Shared Documents/FolderName
  try{
    var u=new URL(url);
    var host=u.hostname; // e.g. risguard.sharepoint.com
    var parts=u.pathname.split('/');
    // Find 'sites' index
    var sitesIdx=parts.indexOf('sites');
    if(sitesIdx===-1)return null;
    var siteName=parts[sitesIdx+1];
    // Everything after the library name is the folder path
    // Common library names: 'Shared Documents', 'Gedeelde documenten', 'Documents'
    var libIdx=-1;
    var libName='';
    ['Shared%20Documents','Gedeelde%20documenten','Documents','Documenten','Shared Documents','Gedeelde documenten'].forEach(function(lib){
      var idx=u.pathname.indexOf(lib);
      if(idx>-1&&libIdx===-1){libIdx=idx;libName=lib;}
    });
    var folderPath='';
    if(libIdx>-1){
      folderPath=decodeURIComponent(u.pathname.substring(libIdx+libName.length));
    }
    return{host:host,siteName:siteName,folderPath:folderPath.replace(/^\/+/,'')};
  }catch(e){return null;}
}

function importFromSharePoint(){
  var url=(document.getElementById('sp-url')||{}).value||'';
  if(!url.trim()){ST._spImportError='Vul een SharePoint URL in.';renderModal();return;}
  if(!AUTH.token){ST._spImportError='Niet ingelogd. Log eerst in met Microsoft.';renderModal();return;}

  ST._spImportLoading=true;ST._spImportError='';renderModal();

  var parsed=parseSharePointUrl(url);
  if(!parsed){
    ST._spImportLoading=false;ST._spImportError='Ongeldige SharePoint URL. Kopieer de URL direct uit de adresbalk.';renderModal();return;
  }

  // Get site ID first
  acquireToken().then(function(token){
    return fetch('https://graph.microsoft.com/v1.0/sites/'+parsed.host+':/sites/'+parsed.siteName,{
      headers:{Authorization:'Bearer '+token}
    }).then(function(r){return r.json();});
  }).then(function(site){
    if(!site.id){throw new Error('Site niet gevonden: '+parsed.siteName);}
    var siteId=site.id;
    // Get default drive
    return acquireToken().then(function(token){
      return fetch('https://graph.microsoft.com/v1.0/sites/'+siteId+'/drive',{
        headers:{Authorization:'Bearer '+token}
      }).then(function(r){return r.json();}).then(function(drive){
        var driveId=drive.id;
        // Get folder children
        var path=parsed.folderPath?'/root:/'+parsed.folderPath+':/children':'/root/children';
        return acquireToken().then(function(token2){
          return fetch('https://graph.microsoft.com/v1.0/drives/'+driveId+path,{
            headers:{Authorization:'Bearer '+token2}
          }).then(function(r){return r.json();});
        });
      });
    });
  }).then(function(result){
    ST._spImportLoading=false;
    if(!result.value||!result.value.length){
      ST._spImportError='Geen bestanden gevonden in deze map.';renderModal();return;
    }
    var c=clients()[ST.sel];if(!c)return;
    if(!c.inbox)c.inbox=[];
    var added=0;
    result.value.forEach(function(item){
      if(item.folder)return; // skip subfolders
      var ext=(item.name.match(/\.([^.]+)$/)||['',''])[1].toLowerCase();
      if(!['docx','doc','xlsx','xls','pdf','pptx','ppt'].includes(ext))return;
      // Check not already in inbox
      if(c.inbox.some(function(d){return d.name===item.name;}))return;
      var m=detectMeta(item.name);
      c.inbox.push({
        name:cleanName(item.name),
        link:item.webUrl||'',
        category:m.cat||'',
        control:'',
        controls:[],
        status:'concept',
        date:today(),
        spId:item.id
      });
      added++;
    });
    saveDB();closeModal();render();
    if(added===0)alert('Alle bestanden staan al in de inbox.');
  }).catch(function(e){
    ST._spImportLoading=false;
    ST._spImportError='Fout: '+( e.message||'Kon bestanden niet ophalen. Controleer de URL en je toegangsrechten.');
    renderModal();
  });
}

function gapPct(c){
  var gc=c.gapControls||[];if(!gc.length)return 0;
  var ap=gc.filter(function(x){return x.applicable;});if(!ap.length)return 0;
  var done=ap.filter(function(x){return x.status==='gap'||x.status==='compliant';}).length;
  return Math.round(done/ap.length*100);
}

function freshGapControls(){
  return ANNEX_A_TEMPLATE.map(function(c){
    return Object.assign({applicable:true,currentState:'',desiredState:'',gap:'',priority:'',status:''},c);
  });
}

function freshGapClauses(){
  return CLAUSES_TEMPLATE.map(function(c){
    return Object.assign({currentState:'',desiredState:'',priority:'',status:''},c);
  });
}
