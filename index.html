function startNextPhase(i){
  var moduleOrder=['gap','impl','audit'];
  var moduleLabels={'gap':'GAP Assessment','impl':'Implementatie','audit':'Internal Audit'};
  var cur=ST.module;
  var curIdx=moduleOrder.indexOf(cur);
  if(curIdx===-1||curIdx===moduleOrder.length-1){alert('Dit is al de laatste fase.');return;}
  var nextModule=moduleOrder[curIdx+1];
  var nextLabel=moduleLabels[nextModule];
  var c=DB[cur][i];

  var exists=DB[nextModule].some(function(x){return x.name===c.name;});
  if(exists){
    var choice=window.confirm(
      'Klant "'+c.name+'" bestaat al in '+nextLabel+'.\n\n'+
      'Klik OK om samen te voegen (bestaande data blijft behouden, nieuwe data wordt toegevoegd).\n'+
      'Klik Annuleren om te stoppen.'
    );
    if(!choice)return;
    // Merge: keep existing record, just add missing items rather than overwrite
    var existingIdx=DB[nextModule].findIndex(function(x){return x.name===c.name;});
    var existing=DB[nextModule][existingIdx];
    // Merge noteLog (append new entries not already present)
    var existingNotes=existing.noteLog||[];
    var newNotes=(c.noteLog||[]).filter(function(n){
      return !existingNotes.some(function(e){return e.date===n.date&&e.text===n.text;});
    });
    existing.noteLog=(existingNotes).concat(newNotes);
    // For impl: merge docs (add docs not already present by name)
    if(nextModule==='impl'){
      existing.docs=existing.docs||[];
      // Build new docs list from GAP data
      var newDocs=[];
      (c.gapControls||[]).forEach(function(ctrl){
        if(!ctrl.applicable||!ctrl.status||ctrl.status==='compliant')return;
        var tmpl=ANNEX_A_TEMPLATE.filter(function(t){return t.id===ctrl.id;})[0];
        var docName=tmpl?tmpl.doc:ctrl.name;
        if(!existing.docs.some(function(d){return d.name===docName;})){
          newDocs.push({name:docName,link:'',category:(function(g){return g==='A.5'?'Policy':g==='A.6'?'Procedure':g==='A.7'?'Policy':'Policy';})(ctrl.group||'A.5'),controls:[(function(id){if(/^A\.[5678]\./.test(id))return id;if(/^[5678]\./.test(id))return'A.'+id;return'Clause '+id;})(ctrl.id)],phase:PHASES[1],status:'concept',date:today(),note:'Control: '+ctrl.id+(ctrl.gap?' | Gap: '+ctrl.gap:'')+(ctrl.currentState?' | Huidig: '+ctrl.currentState:'')});
        }
      });
      (c.gapClauses||[]).forEach(function(cl){
        if(!cl.status||cl.status==='compliant')return;
        var tmpl=CLAUSES_TEMPLATE.filter(function(t){return t.id===cl.id;})[0];
        var docName=tmpl?tmpl.doc:cl.name;
        if(!existing.docs.some(function(d){return d.name===docName;})){
          newDocs.push({name:docName,link:'',category:'Policy',control:'Clause '+cl.id,phase:PHASES[1],status:'concept',date:today(),note:'Clausule: '+cl.id+(cl.gap?' | Gap: '+cl.gap:'')+(cl.currentState?' | Huidig: '+cl.currentState:'')});
        }
      });
      existing.docs=existing.docs.concat(newDocs);
      (c.findings||[]).forEach(function(f){
        existing.noteLog.push({date:f.date||today(),text:'[GAP Bevinding] '+f.domain+(f.control?' — '+f.control:'')+': '+(f.description||'')});
      });
    }
    saveDB();switchModule(nextModule);
    return;
  }
  if(!confirm('Klant "'+c.name+'" doorzetten van '+moduleLabels[cur]+' naar '+nextLabel+'?\nAlle relevante data wordt automatisch meegenomen.'))return;

  var base={name:c.name,contact:c.contact||'',phase:c.phase||'',noteLog:c.noteLog?JSON.parse(JSON.stringify(c.noteLog)):[]};

  // ── GAP → IMPLEMENTATIE ────────────────────────────────────────────────────
  if(cur==='gap'&&nextModule==='impl'){
    var docs=[];

    // Helper: determine category from control group
    function catFromGroup(grp){
      if(grp==='A.5')return 'Policy';
      if(grp==='A.6')return 'Procedure';
      if(grp==='A.7')return 'Policy';
      if(grp==='A.8')return 'Policy';
      return 'Overig';
    }

    // Annex A controls met gap/ofi/minor/major → document per control, naam = doc field
    (c.gapControls||[]).forEach(function(ctrl){
      if(!ctrl.applicable||!ctrl.status||ctrl.status==='compliant')return;
      // Use the doc name from ANNEX_A_TEMPLATE
      var tmpl=ANNEX_A_TEMPLATE.filter(function(t){return t.id===ctrl.id;})[0];
      var docName=tmpl?tmpl.doc:ctrl.name;
      var grp=ctrl.group||'A.5';
      var ctrlLabel=grp+' — '+(grp==='A.5'?'Organisational':grp==='A.6'?'People':grp==='A.7'?'Physical':'Technological');
      docs.push({
        name:docName,
        link:'',
        category:catFromGroup(grp),
        controls:[(function(id){if(/^A.[5678]./.test(id))return id;if(/^[5678]./.test(id))return'A.'+id;return'Clause '+id;})(ctrl.id)],
        phase:PHASES[1],
        status:'concept',
        date:today(),
        note:'Control: '+ctrl.id+(ctrl.gap?' | Gap: '+ctrl.gap:'')+(ctrl.currentState?' | Huidig: '+ctrl.currentState:'')
      });
    });

    // Clausules met afwijking → document per clausule, naam = doc field
    (c.gapClauses||[]).forEach(function(cl){
      if(!cl.status||cl.status==='compliant')return;
      var tmpl=CLAUSES_TEMPLATE.filter(function(t){return t.id===cl.id;})[0];
      var docName=tmpl?tmpl.doc:cl.name;
      docs.push({
        name:docName,
        link:'',
        category:'Policy',
        control:'Clause '+cl.id,
        phase:PHASES[1],
        status:'concept',
        date:today(),
        note:'Clausule: '+cl.id+(cl.gap?' | Gap: '+cl.gap:'')+(cl.currentState?' | Huidig: '+cl.currentState:'')
      });
    });

    // Bevindingen → notitielogboek
    (c.findings||[]).forEach(function(f){
      base.noteLog.push({date:f.date||today(),text:'[GAP Bevinding] '+f.domain+(f.control?' — '+f.control:'')+': '+(f.description||'')});
    });

    base.docs=docs;
  }

  // ── IMPLEMENTATIE → AUDIT ──────────────────────────────────────────────────
  else if(cur==='impl'&&nextModule==='audit'){
    var annexA=freshAnnex();
    var auditClauses=freshClauses();

    // Build lookup: doc name → {docName, docLink, status}
    var docByName={};
    (c.docs||[]).forEach(function(doc){
      docByName[doc.name.toLowerCase().trim()]={docName:doc.name,docLink:doc.link||'',approved:doc.status==='approved'};
    });

    // Match Annex A: use the doc field from template for exact matching
    annexA.forEach(function(a){
      var tmpl=ANNEX_A_TEMPLATE.filter(function(t){return t.id===a.id;})[0];
      if(!tmpl)return;
      // Try exact doc name match
      var key=tmpl.doc.toLowerCase().trim();
      var match=docByName[key];
      if(match&&match.approved){
        a.docName=match.docName;
        a.docLink=match.docLink;
      }
      // Also try by control reference (group match for approved docs)
      if(!a.docName){
        var grp=a.group;
        var ctrlLabel=grp+' — '+(grp==='A.5'?'Organisational':grp==='A.6'?'People':grp==='A.7'?'Physical':'Technological');
        (c.docs||[]).forEach(function(doc){
          var _dc1=Array.isArray(doc.controls)?doc.controls:(doc.control?[doc.control]:[]);if(_dc1.indexOf(ctrlLabel)!==-1&&doc.status==='approved'&&!a.docName){
            a.docName=doc.name;a.docLink=doc.link||'';
          }
        });
      }
    });

    // Match Clauses: use doc field from template
    auditClauses.forEach(function(cl){
      var tmpl=CLAUSES_TEMPLATE.filter(function(t){return t.id===cl.id;})[0];
      if(!tmpl)return;
      var key=tmpl.doc.toLowerCase().trim();
      var match=docByName[key];
      if(match&&match.approved){
        cl.docName=match.docName;
        cl.docLink=match.docLink;
      }
      // Also try clause number match
      if(!cl.docName){
        var pfx='Clause '+cl.id.split('.')[0];
        (c.docs||[]).forEach(function(doc){
          var _dc2=Array.isArray(doc.controls)?doc.controls:(doc.control?[doc.control]:[]);if(_dc2.indexOf(pfx)!==-1&&doc.status==='approved'&&!cl.docName){
            cl.docName=doc.name;cl.docLink=doc.link||'';
          }
        });
      }
    });

    // Niet-goedgekeurde docs als notitie
    var openDocs=(c.docs||[]).filter(function(d){return d.status!=='approved';});
    if(openDocs.length)
      base.noteLog.push({date:today(),text:'[Uit Implementatie] Nog niet goedgekeurd: '+openDocs.map(function(d){return d.name;}).join(', ')});

    base.annexA=annexA;
    base.clauses=auditClauses;
    base.findings=[];
    base.interview={};
  }

  // ── Fallback ───────────────────────────────────────────────────────────────
  else {
    if(nextModule==='impl')base.docs=[];
    else{base.annexA=freshAnnex();base.clauses=freshClauses();base.findings=[];base.interview={};}
  }

  DB[nextModule].push(base);saveDB();
  ST.module=nextModule;ST.view='clients';ST.sel=null;render();
  setTimeout(function(){
    document.querySelectorAll('.client-card .c-name').forEach(function(el){
      if(el.textContent===c.name){
        el.closest('.client-card').style.outline='2px solid var(--blue)';
        setTimeout(function(){el.closest('.client-card').style.outline='';},2000);
      }
    });
  },100);
}

function gapPct(c){
  var gc=c.gapControls||[];if(!gc.length)return 0;
  var ap=gc.filter(function(x){return x.applicable;});if(!ap.length)return 0;
  var done=ap.filter(function(x){return x.status==='gap'||x.status==='compliant';}).length;
  return Math.round(done/ap.length*100);
}

function freshGapControls(){
  return ANNEX_A_TEMPLATE.map(function(c){
    return Object.assign({applicable:true,currentState:'',desiredState:'',gap:'',priority:'',status:''},c);
  });
}

function freshGapClauses(){
  return CLAUSES_TEMPLATE.map(function(c){
    return Object.assign({currentState:'',desiredState:'',priority:'',status:''},c);
  });
}

function renderGapDetail(){
  var c=clients()[ST.sel];
  if(!c.gapControls)c.gapControls=freshGapControls();
  if(!c.gapClauses)c.gapClauses=freshGapClauses();
  if(!c.findings)c.findings=[];
  var gc=c.gapControls;
  var ap=gc.filter(function(x){return x.applicable;});
  var done=ap.filter(function(x){return x.status&&x.status!==''&&x.status!=='open';}).length;
  var p=ap.length?Math.round(done/ap.length*100):0;

  var high=ap.filter(function(x){return x.priority==='hoog';}).length;
  var med=ap.filter(function(x){return x.priority==='midden';}).length;
  var low=ap.filter(function(x){return x.priority==='laag';}).length;
  var open=ap.filter(function(x){return !x.status||x.status==='open';}).length;

  var h='<div class="det-hdr"><div class="det-avatar">'+ini(c.name)+'</div><div><div class="det-name">'+c.name+'</div><div class="det-sub">'+(c.contact||'')+'</div></div></div>';
  h+=renderScopeCard(c);
  h+='<div class="prog-hdr"><div class="prog-pct">'+p+'%</div><div class="prog-trk"><div class="prog-lbl">Gap assessment voortgang &mdash; '+done+' van '+ap.length+' controls beoordeeld</div><div class="prog-bar"><div class="prog-fill" style="width:'+p+'%"></div></div></div></div>';
  var gapCount=ap.filter(function(x){return x.status==='gap';}).length;
  var compliantCount=ap.filter(function(x){return x.status==='compliant';}).length;
  var openCount=ap.filter(function(x){return !x.status||x.status==='';}).length;
  h+='<div class="stats-row"><div class="stat-card"><div class="stat-val" style="color:#DC2626">'+gapCount+'</div><div class="stat-lbl">GAP</div></div><div class="stat-card"><div class="stat-val" style="color:#0F6E56">'+compliantCount+'</div><div class="stat-lbl">Compliant</div></div><div class="stat-card"><div class="stat-val" style="color:#5A6B7E">'+openCount+'</div><div class="stat-lbl">Open / niet beoordeeld</div></div><div class="stat-card"><div class="stat-val" style="color:var(--blue)">'+ap.length+'</div><div class="stat-lbl">Totaal in scope</div></div></div>';

  h+='<div class="tabs"><button class="tab'+(ST.gapTab==='clausules'?' active':'')+'" onclick="setGapTab(\'clausules\')">Clausules ('+c.gapClauses.length+')</button><button class="tab'+(ST.gapTab==='annexa'?' active':'')+'" onclick="setGapTab(\'annexa\')">Annex A ('+ap.length+' applicable)</button><button class="tab'+(ST.gapTab==='notes'?' active':'')+'" onclick="setGapTab(\'notes\')">Notities</button></div>';

  if(ST.gapTab==='clausules')h+=renderGapClausules(c);
  else if(ST.gapTab==='annexa'){
    var groups=['A.5','A.6','A.7','A.8'];
    h+='<div style="display:flex;gap:4px;margin-bottom:1.25rem;flex-wrap:wrap">';
    groups.forEach(function(g){
      h+='<button onclick="ST.gapGrp=\''+g+'\';renderGapGrp()" class="btn btn-sm'+(ST.gapGrp===g?' btn-primary':'')+'" style="font-size:12px">'+g+'</button>';
    });
    h+='</div><div id="gap-grp-content">'+buildGapGrp(c)+'</div>';
  } else {
    h+=renderNotesTab();
  }
  return h;
}

function statusColor(s){
  if(s==='compliant')return 'background:#E1F5EE;color:#0F6E56;';
  if(s==='gap')return 'background:#FEE2E2;color:#DC2626;';
  return 'background:#F0F4F8;color:#5A6B7E;';
}

function updateStatusColor(sel){
  var s=sel.value;
  if(s==='compliant'){sel.style.background='#E1F5EE';sel.style.color='#0F6E56';}
  else if(s==='gap'){sel.style.background='#FEE2E2';sel.style.color='#DC2626';}
  else{sel.style.background='#F0F4F8';sel.style.color='#5A6B7E';}
}

function updatePrioColor(sel){
  var v=sel.value;
  sel.style.color=v==='hoog'?'#E53E3E':v==='midden'?'var(--amber)':v==='laag'?'var(--green)':'var(--text-muted)';
}

function updateProgressBar(){
  var c=clients()[ST.sel];if(!c)return;
  var p,lbl,statCards;
  if(ST.module==='gap'){
    var gc=c.gapControls||[];var ap=gc.filter(function(x){return x.applicable;});
    var done=ap.filter(function(x){return x.status&&x.status!=='open';}).length;
    p=ap.length?Math.round(done/ap.length*100):0;
    lbl='Gap assessment voortgang — '+done+' van '+ap.length+' controls beoordeeld';
    var gapC=ap.filter(function(x){return x.status==='gap';}).length;
    var complC=ap.filter(function(x){return x.status==='compliant';}).length;
    var openC=ap.filter(function(x){return !x.status||x.status==='';}).length;
    statCards=[gapC,complC,openC,ap.length];
  } else if(ST.module==='audit'){
    var aa=c.annexA||[];var apA=aa.filter(function(x){return x.applicable;});
    var conf=apA.filter(function(x){return x.status==='compliant';}).length;
    var minor=apA.filter(function(x){return x.status==='minor';}).length;
    var major=apA.filter(function(x){return x.status==='major';}).length;
    var openA=apA.filter(function(x){return !x.status||x.status==='open';}).length;
    p=apA.length?Math.round(conf/apA.length*100):0;
    lbl='Audit voortgang — '+conf+' van '+apA.length+' applicable controls conform';
    statCards=[conf,minor,major,openA];
  } else {
    var docs=c.docs||[];var apr=docs.filter(function(d){return d.status==='approved';}).length;
    var rev=docs.filter(function(d){return d.status==='review';}).length;
    var con=docs.filter(function(d){return d.status==='concept';}).length;
    p=docs.length?Math.round(apr/docs.length*100):0;
    lbl='Totale voortgang — '+apr+' van '+docs.length+' documenten goedgekeurd';
    statCards=[apr,rev,con,docs.length];
  }
  var con=document.getElementById('content');if(!con)return;
  var pctEl=con.querySelector('.prog-pct');if(pctEl)pctEl.textContent=p+'%';
  var fillEl=con.querySelector('.prog-fill');if(fillEl)fillEl.style.width=p+'%';
  var lblEl=con.querySelector('.prog-lbl');if(lblEl)lblEl.textContent=lbl;
  var cards=con.querySelectorAll('.stat-val');
  if(cards.length>=4){cards[0].textContent=statCards[0];cards[1].textContent=statCards[1];cards[2].textContent=statCards[2];cards[3].textContent=statCards[3];}
}

function saveGapField(ri,field,val){
  var c=clients()[ST.sel];if(!c||!c.gapControls)return;
  c.gapControls[ri][field]=val;saveDB();
  if(field==='status'||field==='priority')updateProgressBar();
}

function toggleGapApplicable(ri){
  var c=clients()[ST.sel];
  c.gapControls[ri].applicable=!c.gapControls[ri].applicable;
  saveDB();renderGapGrp();
}

function toggleAllGapApplicable(){
  var c=clients()[ST.sel];
  var rows=c.gapControls.filter(function(x){return x.group===ST.gapGrp;});
  var allOn=rows.every(function(x){return x.applicable;});
  rows.forEach(function(x){x.applicable=!allOn;});
  saveDB();renderGapGrp();
}

  if(!c.interview)c.interview={};
  if(!c.interview[key])c.interview[key]={q:'',observed:'',status:''};
  c.interview[key][field]=val;saveDB();
}

function deleteFinding(fi){
  var c=clients()[ST.sel];if(!c)return;
  if(!confirm('Bevinding verwijderen?'))return;
  c.findings.splice(fi,1);saveDB();render();
}

function exportAuditWord(){
  var c=clients()[ST.sel];if(!c)return;
  var cl=c.clauses||[];var aa=c.annexA||[];var iv=c.interview||{};
  var findings=[];
  cl.forEach(function(item){
    var ivd=iv['clause_'+item.id]||{};
    var status=item.status||'';
    var finding=item.finding||(ivd.observed||'');
    var bevinding=ivd.finding||'';
    var rec=item.improvement||(ivd.q||'');
    var isReportable=(status==='major'||status==='minor'||status==='ofi'||status==='gap');
    if(status==='compliant')return;
    if(isReportable||finding||bevinding)
      findings.push({num:findings.length+1,type:'clause',id:item.id,title:item.name,status:status||'open',finding:finding,bevinding:bevinding,rec:rec});
  });
  aa.filter(function(x){return x.applicable;}).forEach(function(item){
    var ivd=iv[item.id]||{};
    var status=item.status||'';
    var finding=item.finding||(ivd.observed||'');
    var bevinding=ivd.finding||'';
    var rec=item.improvement||(ivd.q||'');
    var isReportable2=(status==='major'||status==='minor'||status==='ofi'||status==='gap');
    if(status==='compliant')return;
    if(isReportable2||finding||bevinding)
      findings.push({num:findings.length+1,type:'annex',id:item.id,title:item.name,status:status||'open',finding:finding,bevinding:bevinding,rec:rec});
  });
  var tMajor=findings.filter(function(f){return f.status==='major';}).length;
  var tMinor=findings.filter(function(f){return f.status==='minor';}).length;
  var tOfi  =findings.filter(function(f){return f.status==='ofi';}).length;

  function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function evalLabel(s){return s==='major'?'Major Non-Conformity':s==='minor'?'Minor Non-Conformity':s==='ofi'?'Opportunity for Improvement':s==='compliant'?'Compliant':'Open';}
  function evalColor(s){return s==='major'?'C00000':s==='minor'?'C55A11':s==='ofi'?'BF8F00':s==='compliant'?'375623':'888888';}

  function run(t,o){
    o=o||{};
    var rpr='<w:rFonts w:ascii="Arial" w:hAnsi="Arial"/>';

    if(o.color)rpr+='<w:color w:val="'+o.color+'"/>';
    if(o.size)rpr+='<w:sz w:val="'+o.size+'"/><w:szCs w:val="'+o.size+'"/>';
    return'<w:r><w:rPr>'+rpr+'</w:rPr><w:t xml:space="preserve">'+esc(t)+'</w:t></w:r>';

  function para(runs,o){
    o=o||{};

  function today(){var d=new Date();var m=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear();}
  function sLabel(s){return{compliant:'Compliant',gap:'GAP','':'—'}[(s||'').toLowerCase()]||'—';}
  function sXf(s){return{compliant:18,gap:19,'':16}[(s||'').toLowerCase()]||16;}
  function xe(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  var SS=[],SSI={};
  function si(v){v=String(v||'');if(SSI[v]!==undefined)return SSI[v];SSI[v]=SS.length;SS.push(v);return SS.length-1;}
  function sc(col,row,v,xf){return'<c r="'+col+row+'" t="s" s="'+xf+'"><v>'+si(v)+'</v></c>';}
  function ec(col,row,xf){return'<c r="'+col+row+'" s="'+(xf||0)+'"/>';}
  function colW(n,w){return'<col min="'+n+'" max="'+n+'" width="'+w+'" customWidth="1"/>';}

  function styleXml(){
    function fnt(sz,bold,color){return'<font><sz val="'+sz+'"/><name val="Arial"/>'+(bold?'<b/>':'')+'<color rgb="'+color+'"/></font>';}
    function fi(color){return'<fill><patternFill patternType="solid"><fgColor rgb="'+color+'"/></patternFill></fill>';}
    var THIN='<border><left style="thin"><color rgb="FFD1DCE8"/></left><right style="thin"><color rgb="FFD1DCE8"/></right><top style="thin"><color rgb="FFD1DCE8"/></top><bottom style="thin"><color rgb="FFD1DCE8"/></bottom></border>';
    var NONE='<border><left/><right/><top/><bottom/></border>';
    function xf(fi,fo,bo,halign,wrap){
      var al='<alignment horizontal="'+(halign||'left')+'" vertical="center"'+(wrap?' wrapText="1"':'')+'/>';
      return'<xf numFmtId="0" fontId="'+fo+'" fillId="'+fi+'" borderId="'+bo+'" xfId="0" applyAlignment="1">'+al+'</xf>';
    }
    // Fonts: 0=navy11 1=white20b 2=white14b 3=white11b 4=navy11b 5=muted9 6=white11b(hdr)
    // 7=compliant(green) 8=gap(red)
    var fonts='<fonts count="9">'
      +fnt(11,false,'FF0E2841')+fnt(20,true,'FFFFFFFF')+fnt(14,true,'FFFFFFFF')
      +fnt(11,true,'FFFFFFFF')+fnt(11,true,'FF0E2841')+fnt(10,false,'FFB8CDE0')
      +fnt(11,true,'FFFFFFFF')
      +fnt(11,true,'FF375623')
      +fnt(11,true,'FF9C0006')
      +'</fonts>';
    // Fills: 0=none 1=gray125 2=navy 3=blue2 4=midgray 5=white 6=lgray
    // 7=compliant(green) 8=gap(red)
    var fills='<fills count="10">'
      +'<fill><patternFill patternType="none"/></fill>'
      +'<fill><patternFill patternType="gray125"/></fill>'
      +fi('FF0E2841')+fi('FF1D4A9A')+fi('FFE2E8F0')+fi('FFFFFFFF')+fi('FFF5F7FA')
      +fi('FFE2EFDA')
      +fi('FFFCE4D6')
      +fi('FFF0F4F9')+'</fills>';
    var borders='<borders count="2">'+NONE+THIN+'</borders>';
    // xf index:
    // 0=default  1=title(navy,white20b)  2=logobrand(navy,white14b,center)
    // 3=subtitle(navy,muted9,right)  4=clientdate(blue2,white11b)
    // 5=phaseHdr(navy,white11b)  6=groupHdr(blue2,white11b)
    // 7=colHdr(midgray,navy11b,border)  8=ctrlName(white,navy11b,border)
    // 9=ctrlID(white,navy11b,border,center)  10=data(white,navy11,border,wrap)
    // 11=dataCenter(white,navy11,border,center)  12=emptyNavy  13=emptyBlue2
    // 14=emptyMid  15=emptyWhite  16=emptyWhiteBorder
    // 17=inscope(blue2,white11b,center)
    // 18-23=status styles
    var cxfs='<cellXfs count="22">'
      +xf(0,0,0,'left',false)     // 0 default
      +xf(2,1,0,'left',false)     // 1 title
      +xf(2,2,0,'center',false)   // 2 logo brand
      +xf(2,5,0,'right',false)    // 3 subtitle
      +xf(3,3,0,'left',false)     // 4 clientdate
      +xf(2,3,0,'left',false)     // 5 phase header
      +xf(3,3,0,'left',false)     // 6 group header
      +xf(4,4,1,'left',false)     // 7 col header
      +xf(5,4,1,'left',true)      // 8 ctrl name
      +xf(5,4,1,'center',false)   // 9 ctrl ID
      +xf(5,0,1,'left',true)      // 10 data wrap
      +xf(5,0,1,'center',false)   // 11 data center
      +xf(2,0,0,'left',false)     // 12 empty navy
      +xf(3,0,0,'left',false)     // 13 empty blue2
      +xf(4,0,0,'left',false)     // 14 empty midgray
      +xf(5,0,0,'left',false)     // 15 empty white
      +xf(5,0,1,'left',false)     // 16 empty white border
      +xf(3,3,1,'center',false)   // 17 inscope
      +xf(7,7,1,'center',false)   // 18 compliant (green)
      +xf(8,8,1,'center',false)   // 19 gap (red)
      +xf(5,0,1,'center',false)   // 20 empty
      +xf(9,0,1,'left',true)       // 21 alt row (light blue-gray bg)
      +'</cellXfs>';
    return'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      +fonts+fills+borders
      +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
      +cxfs+'</styleSheet>';
  }

  function buildSheet(rows,merges,cols,withDrawing){
    var xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
      +'<sheetViews><sheetView workbookViewId="0"><selection sqref="A1" activeCell="A1"/></sheetView></sheetViews>'
      +'<sheetFormatPr defaultRowHeight="15" customHeight="1"/>'
      +'<cols>'+cols+'</cols><sheetData>';
    rows.forEach(function(row){
      xml+='<row r="'+row.r+'"'+(row.h?' ht="'+row.h+'" customHeight="1"':'')+'>';
      (row.cells||[]).forEach(function(c){xml+=c;});
      xml+='</row>';
    });
    xml+='</sheetData>';
    if(merges.length)xml+='<mergeCells count="'+merges.length+'">'+merges.map(function(m){return'<mergeCell ref="'+m+'"/>';}).join('')+'</mergeCells>';
    if(withDrawing)xml+='<drawing r:id="rId1"/>';
    xml+='</worksheet>';
    return xml;
  }
