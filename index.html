function statusColor(s){
  if(s==='compliant')return 'background:#E1F5EE;color:#0F6E56;';
  if(s==='gap')return 'background:#FEE2E2;color:#DC2626;';
  return 'background:#F0F4F8;color:#5A6B7E;';
}

function updateStatusColor(sel){
  var s=sel.value;
  if(s==='compliant'){sel.style.background='#E1F5EE';sel.style.color='#0F6E56';}
  else if(s==='gap'){sel.style.background='#FEE2E2';sel.style.color='#DC2626';}
  else{sel.style.background='#F0F4F8';sel.style.color='#5A6B7E';}
}

function updatePrioColor(sel){
  var v=sel.value;
  sel.style.color=v==='hoog'?'#E53E3E':v==='midden'?'var(--amber)':v==='laag'?'var(--green)':'var(--text-muted)';
}

function updateProgressBar(){
  var c=clients()[ST.sel];if(!c)return;
  var p,lbl,statCards;
  if(ST.module==='gap'){
    var gc=c.gapControls||[];var ap=gc.filter(function(x){return x.applicable;});
    var done=ap.filter(function(x){return x.status&&x.status!=='open';}).length;
    p=ap.length?Math.round(done/ap.length*100):0;
    lbl='Gap assessment voortgang — '+done+' van '+ap.length+' controls beoordeeld';
    var gapC=ap.filter(function(x){return x.status==='gap';}).length;
    var complC=ap.filter(function(x){return x.status==='compliant';}).length;
    var openC=ap.filter(function(x){return !x.status||x.status==='';}).length;
    statCards=[gapC,complC,openC,ap.length];
  } else if(ST.module==='audit'){
    var aa=c.annexA||[];var apA=aa.filter(function(x){return x.applicable;});
    var conf=apA.filter(function(x){return x.status==='compliant';}).length;
    var minor=apA.filter(function(x){return x.status==='minor';}).length;
    var major=apA.filter(function(x){return x.status==='major';}).length;
    var openA=apA.filter(function(x){return !x.status||x.status==='open';}).length;
    p=apA.length?Math.round(conf/apA.length*100):0;
    lbl='Audit voortgang — '+conf+' van '+apA.length+' applicable controls conform';
    statCards=[conf,minor,major,openA];
  } else {
    var docs=c.docs||[];var apr=docs.filter(function(d){return d.status==='approved';}).length;
    var rev=docs.filter(function(d){return d.status==='review';}).length;
    var con=docs.filter(function(d){return d.status==='concept';}).length;
    p=docs.length?Math.round(apr/docs.length*100):0;
    lbl='Totale voortgang — '+apr+' van '+docs.length+' documenten goedgekeurd';
    statCards=[apr,rev,con,docs.length];
  }
  var con=document.getElementById('content');if(!con)return;
  var pctEl=con.querySelector('.prog-pct');if(pctEl)pctEl.textContent=p+'%';
  var fillEl=con.querySelector('.prog-fill');if(fillEl)fillEl.style.width=p+'%';
  var lblEl=con.querySelector('.prog-lbl');if(lblEl)lblEl.textContent=lbl;
  var cards=con.querySelectorAll('.stat-val');
  if(cards.length>=4){cards[0].textContent=statCards[0];cards[1].textContent=statCards[1];cards[2].textContent=statCards[2];cards[3].textContent=statCards[3];}
}

function saveGapField(ri,field,val){
  var c=clients()[ST.sel];if(!c||!c.gapControls)return;
  c.gapControls[ri][field]=val;saveDB();
  if(field==='status'||field==='priority')updateProgressBar();
}

function toggleGapApplicable(ri){
  var c=clients()[ST.sel];
  c.gapControls[ri].applicable=!c.gapControls[ri].applicable;
  saveDB();renderGapGrp();
}

function toggleAllGapApplicable(){
  var c=clients()[ST.sel];
  var rows=c.gapControls.filter(function(x){return x.group===ST.gapGrp;});
  var allOn=rows.every(function(x){return x.applicable;});
  rows.forEach(function(x){x.applicable=!allOn;});
  saveDB();renderGapGrp();
}

      h+='<td><textarea style="width:100%;min-height:36px;padding:4px 6px;font-size:12px;font-family:DM Sans,sans-serif;border:1px solid var(--border);border-radius:4px;resize:none;overflow:hidden;line-height:1.4" placeholder="Bevinding..." onchange="saveInterviewField(\''+key+'\',\'finding\',this.value)" oninput="autoResize(this)">'+(iv.finding||'').replace(/</g,'&lt;')+'</textarea></td>';
      h+='<td><select onchange="saveInterviewField(\''+key+'\',\'status\',this.value);updateStatusColor(this)" style="font-size:12px;padding:3px 5px;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-weight:600;'+stColor+'"><option value="" style="background:#fff;color:#5A6B7E;font-weight:400">Open</option><option value="compliant" style="background:#E1F5EE;color:#0F6E56"'+(iv.status==='compliant'?' selected':'')+'>Compliant</option><option value="ofi" style="background:#FFF7E6;color:#D97706"'+(iv.status==='ofi'?' selected':'')+'>OFI</option><option value="minor" style="background:#FFF3E0;color:#C05621"'+(iv.status==='minor'?' selected':'')+'>Minor NC</option><option value="major" style="background:#FEE2E2;color:#DC2626"'+(iv.status==='major'?' selected':'')+'>Major NC</option></select></td>';

function renderInterviewGrp(){
  var c=clients()[ST.sel];
  var el=document.getElementById('interview-grp-content');
  if(el)el.innerHTML=buildInterviewGrp(c);
  var btns=document.querySelectorAll('[onclick^="ST.interviewGrp"]');
  btns.forEach(function(b){
    var g=b.getAttribute('onclick').match(/\'([^\']+)\'/)[1];
    b.className='btn btn-sm'+(ST.interviewGrp===g?' btn-primary':'');
  });
}

function saveInterviewField(key,field,val){
  var c=clients()[ST.sel];if(!c)return;
  if(!c.interview)c.interview={};
  if(!c.interview[key])c.interview[key]={q:'',observed:'',status:''};
  c.interview[key][field]=val;saveDB();
}

function deleteFinding(fi){
  var c=clients()[ST.sel];if(!c)return;
  if(!confirm('Bevinding verwijderen?'))return;
  c.findings.splice(fi,1);saveDB();render();
}

function exportAuditWord(){
  var c=clients()[ST.sel];if(!c)return;
  var cl=c.clauses||[];var aa=c.annexA||[];var iv=c.interview||{};
  var findings=[];
  cl.forEach(function(item){
    var ivd=iv['clause_'+item.id]||{};
    var status=item.status||'';
    var finding=item.finding||(ivd.observed||'');
    var bevinding=ivd.finding||'';
    var rec=item.improvement||(ivd.q||'');
    var isReportable=(status==='major'||status==='minor'||status==='ofi'||status==='gap');
    if(status==='compliant')return;
    if(isReportable||finding||bevinding)
      findings.push({num:findings.length+1,type:'clause',id:item.id,title:item.name,status:status||'open',finding:finding,bevinding:bevinding,rec:rec});
  });
  aa.filter(function(x){return x.applicable;}).forEach(function(item){
    var ivd=iv[item.id]||{};
    var status=item.status||'';
    var finding=item.finding||(ivd.observed||'');
    var bevinding=ivd.finding||'';
    var rec=item.improvement||(ivd.q||'');
    var isReportable2=(status==='major'||status==='minor'||status==='ofi'||status==='gap');
    if(status==='compliant')return;
    if(isReportable2||finding||bevinding)
      findings.push({num:findings.length+1,type:'annex',id:item.id,title:item.name,status:status||'open',finding:finding,bevinding:bevinding,rec:rec});
  });
  var tMajor=findings.filter(function(f){return f.status==='major';}).length;
  var tMinor=findings.filter(function(f){return f.status==='minor';}).length;
  var tOfi  =findings.filter(function(f){return f.status==='ofi';}).length;

  function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function evalLabel(s){return s==='major'?'Major Non-Conformity':s==='minor'?'Minor Non-Conformity':s==='ofi'?'Opportunity for Improvement':s==='compliant'?'Compliant':'Open';}
  function evalColor(s){return s==='major'?'C00000':s==='minor'?'C55A11':s==='ofi'?'BF8F00':s==='compliant'?'375623':'888888';}

  function run(t,o){
    o=o||{};
    var rpr='<w:rFonts w:ascii="Arial" w:hAnsi="Arial"/>';
    if(o.bold)rpr+='<w:b/>';
    if(o.color)rpr+='<w:color w:val="'+o.color+'"/>';
    if(o.size)rpr+='<w:sz w:val="'+o.size+'"/><w:szCs w:val="'+o.size+'"/>';
    return'<w:r><w:rPr>'+rpr+'</w:rPr><w:t xml:space="preserve">'+esc(t)+'</w:t></w:r>';
  }
  function para(runs,o){
    o=o||{};
    var pp='';
    if(o.before!==undefined||o.after!==undefined)pp+='<w:spacing w:before="'+(o.before||0)+'" w:after="'+(o.after!==undefined?o.after:80)+'"/>';
    if(o.jc)pp+='<w:jc w:val="'+o.jc+'"/>';
    return'<w:p>'+(pp?'<w:pPr>'+pp+'</w:pPr>':'')+runs+'</w:p>';
  }
  function sp(n){return para('',{before:0,after:n||60});}
  function tcProps(w,fill){
    return'<w:tcPr><w:tcW w:w="'+w+'" w:type="dxa"/>'+(fill?'<w:shd w:val="clear" w:color="auto" w:fill="'+fill+'"/>':'')+
      '<w:tcMar><w:top w:w="90" w:type="dxa"/><w:bottom w:w="90" w:type="dxa"/><w:left w:w="180" w:type="dxa"/><w:right w:w="180" w:type="dxa"/></w:tcMar></w:tcPr>';
  }
  function noTblBorders(){
    return'<w:tblBorders><w:top w:val="none" w:sz="0"/><w:left w:val="none" w:sz="0"/><w:bottom w:val="none" w:sz="0"/><w:right w:val="none" w:sz="0"/><w:insideH w:val="none" w:sz="0"/><w:insideV w:val="none" w:sz="0"/></w:tblBorders>';
  }
  function tbl1(rows){
    return'<w:tbl><w:tblPr><w:tblW w:w="9026" w:type="dxa"/>'+noTblBorders()+'</w:tblPr>'+
      '<w:tblGrid><w:gridCol w:w="9026"/></w:tblGrid>'+rows+'</w:tbl>';
  }
  function hdrRow(label,fill){
    return'<w:tr><w:tc>'+tcProps(9026,fill)+para(run(label,{bold:true,color:'FFFFFF',size:24}),{before:0,after:0})+'</w:tc></w:tr>';
  }
  function evalRow(s){
    return'<w:tr><w:tc>'+tcProps(9026,evalColor(s))+
      para(run('Evaluation: ',{bold:true,color:'FFFFFF',size:20})+run(evalLabel(s),{color:'FFFFFF',size:20}),{before:0,after:0})+
    '</w:tc></w:tr>';
  }
  function labelBlock(lbl,txt){
    if(!txt)return'';
    return para(run(lbl,{bold:true,size:20}),{before:80,after:30})+para(run(txt,{size:20}),{before:0,after:80});
  }
  function sectionHdr(title){
    return para(run(title,{bold:true,color:'1F3864',size:28}),{before:200,after:120})+
      '<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="1F3864"/></w:pBdr><w:spacing w:before="0" w:after="0"/></w:pPr></w:p>';
  }
  function sectionSubHdr(title){
    return para(run(title,{bold:true,color:'2E4057',size:22}),{before:160,after:60});
  }

  var W=9026,w1=4800,w2=4226,w3=6500,w4=2526;
  var ap2=c.auditPlan||{};
  var sd=c.scopeDocs||[];
  var body='';

  function today(){var d=new Date();var m=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear();}
  function sLabel(s){return{compliant:'Compliant',gap:'GAP','':'—'}[(s||'').toLowerCase()]||'—';}
  function sXf(s){return{compliant:18,gap:19,'':16}[(s||'').toLowerCase()]||16;}
  function xe(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  var SS=[],SSI={};
  function si(v){v=String(v||'');if(SSI[v]!==undefined)return SSI[v];SSI[v]=SS.length;SS.push(v);return SS.length-1;}
  function sc(col,row,v,xf){return'<c r="'+col+row+'" t="s" s="'+xf+'"><v>'+si(v)+'</v></c>';}
  function ec(col,row,xf){return'<c r="'+col+row+'" s="'+(xf||0)+'"/>';}
  function colW(n,w){return'<col min="'+n+'" max="'+n+'" width="'+w+'" customWidth="1"/>';}

  function styleXml(){
    function fnt(sz,bold,color){return'<font><sz val="'+sz+'"/><name val="Arial"/>'+(bold?'<b/>':'')+'<color rgb="'+color+'"/></font>';}
    function fi(color){return'<fill><patternFill patternType="solid"><fgColor rgb="'+color+'"/></patternFill></fill>';}
    var THIN='<border><left style="thin"><color rgb="FFD1DCE8"/></left><right style="thin"><color rgb="FFD1DCE8"/></right><top style="thin"><color rgb="FFD1DCE8"/></top><bottom style="thin"><color rgb="FFD1DCE8"/></bottom></border>';
    var NONE='<border><left/><right/><top/><bottom/></border>';
    function xf(fi,fo,bo,halign,wrap){
      var al='<alignment horizontal="'+(halign||'left')+'" vertical="center"'+(wrap?' wrapText="1"':'')+'/>';
      return'<xf numFmtId="0" fontId="'+fo+'" fillId="'+fi+'" borderId="'+bo+'" xfId="0" applyAlignment="1">'+al+'</xf>';
    }
    // Fonts: 0=navy11 1=white20b 2=white14b 3=white11b 4=navy11b 5=muted9 6=white11b(hdr)
    // 7=compliant(green) 8=gap(red)
    var fonts='<fonts count="9">'
      +fnt(11,false,'FF0E2841')+fnt(20,true,'FFFFFFFF')+fnt(14,true,'FFFFFFFF')
      +fnt(11,true,'FFFFFFFF')+fnt(11,true,'FF0E2841')+fnt(10,false,'FFB8CDE0')
      +fnt(11,true,'FFFFFFFF')
      +fnt(11,true,'FF375623')
      +fnt(11,true,'FF9C0006')
      +'</fonts>';
    // Fills: 0=none 1=gray125 2=navy 3=blue2 4=midgray 5=white 6=lgray
    // 7=compliant(green) 8=gap(red)
    var fills='<fills count="10">'
      +'<fill><patternFill patternType="none"/></fill>'
      +'<fill><patternFill patternType="gray125"/></fill>'
      +fi('FF0E2841')+fi('FF1D4A9A')+fi('FFE2E8F0')+fi('FFFFFFFF')+fi('FFF5F7FA')
      +fi('FFE2EFDA')
      +fi('FFFCE4D6')
      +fi('FFF0F4F9')+'</fills>';
    var borders='<borders count="2">'+NONE+THIN+'</borders>';
    // xf index:
    // 0=default  1=title(navy,white20b)  2=logobrand(navy,white14b,center)
    // 3=subtitle(navy,muted9,right)  4=clientdate(blue2,white11b)
    // 5=phaseHdr(navy,white11b)  6=groupHdr(blue2,white11b)
    // 7=colHdr(midgray,navy11b,border)  8=ctrlName(white,navy11b,border)
    // 9=ctrlID(white,navy11b,border,center)  10=data(white,navy11,border,wrap)
    // 11=dataCenter(white,navy11,border,center)  12=emptyNavy  13=emptyBlue2
    // 14=emptyMid  15=emptyWhite  16=emptyWhiteBorder
    // 17=inscope(blue2,white11b,center)
    // 18-23=status styles
    var cxfs='<cellXfs count="22">'
      +xf(0,0,0,'left',false)     // 0 default
      +xf(2,1,0,'left',false)     // 1 title
      +xf(2,2,0,'center',false)   // 2 logo brand
      +xf(2,5,0,'right',false)    // 3 subtitle
      +xf(3,3,0,'left',false)     // 4 clientdate
      +xf(2,3,0,'left',false)     // 5 phase header
      +xf(3,3,0,'left',false)     // 6 group header
      +xf(4,4,1,'left',false)     // 7 col header
      +xf(5,4,1,'left',true)      // 8 ctrl name
      +xf(5,4,1,'center',false)   // 9 ctrl ID
      +xf(5,0,1,'left',true)      // 10 data wrap
      +xf(5,0,1,'center',false)   // 11 data center
      +xf(2,0,0,'left',false)     // 12 empty navy
      +xf(3,0,0,'left',false)     // 13 empty blue2
      +xf(4,0,0,'left',false)     // 14 empty midgray
      +xf(5,0,0,'left',false)     // 15 empty white
      +xf(5,0,1,'left',false)     // 16 empty white border
      +xf(3,3,1,'center',false)   // 17 inscope
      +xf(7,7,1,'center',false)   // 18 compliant (green)
      +xf(8,8,1,'center',false)   // 19 gap (red)
      +xf(5,0,1,'center',false)   // 20 empty
      +xf(9,0,1,'left',true)       // 21 alt row (light blue-gray bg)
      +'</cellXfs>';
    return'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      +fonts+fills+borders
      +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
      +cxfs+'</styleSheet>';
  }

  function buildSheet(rows,merges,cols,withDrawing){
    var xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
      +'<sheetViews><sheetView workbookViewId="0"><selection sqref="A1" activeCell="A1"/></sheetView></sheetViews>'
      +'<sheetFormatPr defaultRowHeight="15" customHeight="1"/>'
      +'<cols>'+cols+'</cols><sheetData>';
    rows.forEach(function(row){
      xml+='<row r="'+row.r+'"'+(row.h?' ht="'+row.h+'" customHeight="1"':'')+'>';
      (row.cells||[]).forEach(function(c){xml+=c;});
      xml+='</row>';
    });
    xml+='</sheetData>';
    if(merges.length)xml+='<mergeCells count="'+merges.length+'">'+merges.map(function(m){return'<mergeCell ref="'+m+'"/>';}).join('')+'</mergeCells>';
    if(withDrawing)xml+='<drawing r:id="rId1"/>';
    xml+='</worksheet>';
    return xml;
  }
